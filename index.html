<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP CSA 学习平台 · Java 从零到 5 分</title>
<style>
  :root{
    --bg:#f5f6fb; --card:#ffffff; --line:#e6e8f0;
    --text:#1f2430; --muted:#6b7280; --soft:#9aa1b2;
    --accent:#6366f1; --accent2:#8b5cf6; --accent-soft:#eef0ff;
    --good:#10b981; --good-soft:#e7f9f1; --bad:#ef4444; --bad-soft:#feecec;
    --warn:#f59e0b; --warn-soft:#fff6e6; --code-bg:#0f172a; --code-text:#e2e8f0;
    --radius:16px; --shadow:0 6px 24px rgba(31,36,48,.08);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.7;
  }
  code,.mono{font-family:"Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace;}
  button{font-family:inherit; cursor:pointer; border:none;}

  /* ---------- 顶栏 ---------- */
  header{
    position:sticky; top:0; z-index:30;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff; display:flex; align-items:center; justify-content:space-between;
    padding:12px 22px; gap:12px; box-shadow:0 2px 12px rgba(99,102,241,.35);
  }
  .brand{font-weight:800; font-size:18px; letter-spacing:.3px; white-space:nowrap;}
  .brand small{font-weight:500; opacity:.85; font-size:12px; margin-left:8px;}
  .stats{display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end;}
  .stat{
    background:rgba(255,255,255,.18); padding:5px 12px; border-radius:999px;
    font-weight:600; font-size:13px; white-space:nowrap;
  }

  /* ---------- 布局 ---------- */
  .layout{display:flex; max-width:1200px; margin:0 auto; gap:20px; padding:20px; min-height:calc(100vh - 60px);}
  aside{width:230px; flex-shrink:0;}
  main{flex:1; min-width:0;}

  /* ---------- 侧边栏 ---------- */
  #sidebar{
    position:sticky; top:80px; display:flex; flex-direction:column; gap:6px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; box-shadow:var(--shadow);
  }
  .nav-btn{
    text-align:left; background:none; padding:9px 12px; border-radius:10px;
    font-size:14px; color:var(--text); transition:.15s; display:flex; align-items:center; gap:8px;
  }
  .nav-btn:hover{background:var(--accent-soft);}
  .nav-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-weight:600;}
  .nav-btn .dot{width:8px; height:8px; border-radius:50%; background:var(--soft); flex-shrink:0;}
  .nav-btn.done .dot{background:var(--good);}
  .nav-group{font-size:11px; color:var(--soft); font-weight:700; letter-spacing:1px; margin:10px 6px 2px; text-transform:uppercase;}

  /* ---------- 卡片与通用 ---------- */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow); margin-bottom:18px;}
  h1{font-size:26px; font-weight:800; margin-bottom:6px;}
  h2{font-size:20px; font-weight:800; margin:22px 0 10px;}
  h3{font-size:16px; font-weight:800; margin:18px 0 8px; display:flex; align-items:center; gap:8px;}
  .sub{color:var(--muted); font-size:14px;}
  .muted{color:var(--muted);}
  .row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .spread{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}

  .btn{
    display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:14px;
    padding:10px 18px; border-radius:12px; transition:.15s;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
  }
  .btn:hover{transform:translateY(-1px); box-shadow:0 6px 16px rgba(99,102,241,.35);}
  .btn.ghost{background:#fff; color:var(--accent); border:1.5px solid var(--accent);}
  .btn.ghost:hover{background:var(--accent-soft);}
  .btn.sm{padding:7px 13px; font-size:13px; border-radius:9px;}
  .btn:disabled{opacity:.5; cursor:not-allowed; transform:none; box-shadow:none;}

  /* ---------- 首页 ---------- */
  .hero{
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
    border-radius:var(--radius); padding:30px 28px; box-shadow:var(--shadow); margin-bottom:18px;
  }
  .hero h1{font-size:28px;}
  .hero p{opacity:.92; margin:8px 0 16px; max-width:640px;}
  .unit-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
  .unit-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow); transition:.15s; cursor:pointer; position:relative; overflow:hidden;
  }
  .unit-card:hover{transform:translateY(-3px); box-shadow:0 12px 28px rgba(31,36,48,.14);}
  .unit-card .bar{position:absolute; top:0; left:0; height:4px; width:100%; background:var(--line);}
  .unit-card .bar i{display:block; height:100%; background:linear-gradient(90deg,var(--good),#34d399);}
  .unit-card .icon{font-size:30px;}
  .unit-card h3{margin:8px 0 2px; font-size:16px;}
  .unit-card .cn{font-size:13px; color:var(--muted); font-weight:600;}
  .unit-card .pct{font-size:12px; color:var(--soft); margin-top:6px;}

  /* ---------- 进度条 ---------- */
  .pbar{height:10px; background:var(--line); border-radius:999px; overflow:hidden;}
  .pbar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:999px; transition:.4s;}
  .pbar.good i{background:linear-gradient(90deg,var(--good),#34d399);}

  /* ---------- 学习块 ---------- */
  .block-code{
    background:var(--code-bg); color:var(--code-text); border-radius:12px; padding:16px 18px;
    font-size:14px; line-height:1.6; overflow-x:auto; margin:10px 0; white-space:pre;
  }
  .kw{color:#c4b5fd; font-weight:600;} .st{color:#86efac;} .num{color:#fca5a5;} .cm{color:#64748b; font-style:italic;}
  .callout{border-radius:12px; padding:12px 16px; margin:12px 0; font-size:14px; display:flex; gap:10px;}
  .callout.tip{background:var(--good-soft); border-left:4px solid var(--good);}
  .callout.warn{background:var(--warn-soft); border-left:4px solid var(--warn);}
  .callout.err{background:var(--bad-soft); border-left:4px solid var(--bad);}
  .callout .ico{font-size:18px; line-height:1.4;}
  ul.li{margin:8px 0 8px 4px; padding-left:22px;}
  ul.li li{margin:4px 0;}
  p.body{margin:8px 0; font-size:15px;}
  p.body code, .li code, .explain code, .q-text code{background:var(--accent-soft); color:var(--accent); padding:1px 6px; border-radius:6px; font-size:.92em;}

  .tabs{display:inline-flex; background:#eef0f6; border-radius:12px; padding:4px; margin-bottom:16px;}
  .tab{padding:8px 18px; border-radius:9px; font-weight:700; font-size:14px; color:var(--muted); background:none;}
  .tab.active{background:#fff; color:var(--accent); box-shadow:0 2px 8px rgba(31,36,48,.1);}

  /* ---------- 题目 ---------- */
  .q-text{font-size:16px; font-weight:600; margin:4px 0 12px;}
  .q-meta{font-size:12px; color:var(--soft); margin-bottom:6px;}
  .options{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .opt{
    text-align:left; background:var(--bg); border:2px solid var(--line); border-radius:12px;
    padding:12px 16px; font-size:15px; transition:.12s; display:flex; gap:12px; align-items:flex-start;
  }
  .opt .ltr{font-weight:800; color:var(--accent); flex-shrink:0;}
  .opt:hover{border-color:var(--accent); background:var(--accent-soft);}
  .opt.correct{border-color:var(--good); background:var(--good-soft);}
  .opt.wrong{border-color:var(--bad); background:var(--bad-soft);}
  .opt.disabled{pointer-events:none;}
  .explain{margin-top:14px; border-radius:12px; padding:14px 16px; font-size:14px;}
  .explain.good{background:var(--good-soft);}
  .explain.bad{background:var(--bad-soft);}
  .explain b{display:block; margin-bottom:4px;}

  /* ---------- FRQ ---------- */
  textarea{
    width:100%; min-height:140px; border:2px solid var(--line); border-radius:12px;
    padding:12px; font-size:14px; font-family:inherit; resize:vertical; margin:10px 0;
  }
  textarea:focus{outline:none; border-color:var(--accent);}
  .rubric{background:var(--warn-soft); border-left:4px solid var(--warn); border-radius:12px; padding:14px 16px; margin:10px 0; font-size:14px;}
  .rubric li{margin:5px 0;}
  .checkrow{display:flex; gap:12px; align-items:center; padding:8px 0; border-bottom:1px dashed var(--line);}
  .checkrow input{width:18px; height:18px; accent-color:var(--accent);}

  /* ---------- 徽章 ---------- */
  .badges{display:flex; gap:10px; flex-wrap:wrap;}
  .badge{
    display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px; min-width:86px;
    border-radius:12px; background:var(--bg); border:1px solid var(--line); font-size:12px; text-align:center;
  }
  .badge .b-ico{font-size:26px; filter:grayscale(1); opacity:.35;}
  .badge.earned .b-ico{filter:none; opacity:1;}
  .badge.earned{border-color:var(--warn); background:var(--warn-soft);}

  /* ---------- 提示 / 彩带 ---------- */
  #toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
    background:#1f2430; color:#fff; padding:12px 20px; border-radius:12px; font-size:14px;
    opacity:0; transition:.3s; z-index:99; max-width:90vw; box-shadow:0 8px 24px rgba(0,0,0,.3);
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .confetti{position:fixed; top:-20px; z-index:100; pointer-events:none; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg); opacity:.2;}}

  /* ---------- 响应式 ---------- */
  @media(max-width:820px){
    .layout{flex-direction:column; padding:12px;}
    aside{width:100%;}
    #sidebar{position:static; flex-direction:row; overflow-x:auto; gap:4px; padding:10px;}
    .nav-btn{white-space:nowrap;}
    .nav-group{display:none;}
    .brand small{display:none;}
  }
  .table-wrap{overflow-x:auto;}
  table{border-collapse:collapse; width:100%; font-size:14px; margin:10px 0;}
  th,td{border:1px solid var(--line); padding:8px 12px; text-align:left;}
  th{background:var(--accent-soft);}
  td code{background:var(--accent-soft); color:var(--accent); padding:1px 6px; border-radius:6px;}
</style>
</head>
<body>
  <header>
    <div class="brand">☕ AP CSA 学习平台<small>Java 从零到 5 分</small></div>
    <div class="stats">
      <span class="stat" id="stat-level">Lv.1 新手</span>
      <span class="stat" id="stat-xp">0 XP</span>
      <span class="stat" id="stat-streak">🔥 0 天</span>
      <span class="stat" id="stat-pct">0% 掌握</span>
    </div>
  </header>

  <div class="layout">
    <aside><nav id="sidebar"></nav></aside>
    <main id="main"></main>
  </div>

  <div id="toast"></div>

<script>
/* ============================================================
   数据区（单元 / FRQ / 速查表）
   ============================================================ */
const UNITS = [];
UNITS.push({
  id: 1, title: "Primitive Types", cn: "基础类型", icon: "🔢",
  objective: "认识变量、四种原始类型、算术运算与类型转换",
  lesson: [
    {t:"h", text:"变量与数据类型"},
    {t:"p", text:"Java 是**强类型**语言：每个变量必须先声明类型，之后只能装该类型的值。AP CSA 只考四种原始类型（primitive types）：`int`（整数）、`double`（小数）、`boolean`（真假）、`char`（单个字符）。"},
    {t:"c", code:"int age = 16;          // 整数，约 -21亿 ~ 21亿\n" +
                    "double gpa = 3.75;     // 浮点数，带小数点\n" +
                    "boolean pass = true;   // 只有 true 或 false\n" +
                    "char grade = 'A';      // 单个字符，用单引号\n" +
                    "String name = \"Alex\";  // 字符串（引用类型），用双引号"},
    {t:"tip", text:"变量命名用 **camelCase**（小驼峰）：第一个单词小写，后面每个单词首字母大写，如 `studentAge`、`finalScore`。AP 阅卷会看命名习惯。"},
    {t:"h", text:"算术运算与优先级"},
    {t:"c", code:"+  -  *  /  %   （加、减、乘、除、取余）\n" +
                    "先乘除取余，后加减；同级从左到右；括号最高。"},
    {t:"warn", text:"**整数除法会截断**（直接丢掉小数，不是四舍五入）：`7 / 2` 得到 `3` 而不是 `3.5`。只要参与运算的一方是 `double`，结果就是 `double`。"},
    {t:"h", text:"取余 %"},
    {t:"p", text:"`a % b` 返回 a 除以 b 的**余数**。`13 % 5` 得 `3`。判断奇偶常用 `n % 2 == 1`（奇数）或 `n % 2 == 0`（偶数）。"},
    {t:"h", text:"类型转换（casting）"},
    {t:"c", code:"(int) 3.7    → 3     // 强制转 int，直接砍掉小数\n" +
                    "(double) 7   → 7.0   // 转 double\n" +
                    "double d = 7 / 2;      // 先算 7/2=3（整数），再变成 3.0\n" +
                    "double d = (double)7/2; // 先转 7.0，再除 → 3.5"},
    {t:"warn", text:"`(double) 7 / 2` 是先把 7 转成 7.0 再除，得 3.5；而 `7 / 2` 先按整数算出 3。**转换的时机**非常关键，是高频考点。"},
    {t:"li", items:["`int` 存整数，`double` 存小数，`boolean` 存 true/false，`char` 存单字符","`7/2` 得 3（截断），`7.0/2` 得 3.5","`%` 是取余数，`(int)` 是砍掉小数","运算优先级：括号 → 乘除取余 → 加减"]},
  ],
  questions: [
    {kind:"trace", q:"下面代码运行后，x 的值是？", code:"int x = 7 / 2;", options:["3","3.5","4","2"], answer:0, explain:"`7 / 2` 是两个 int 相除，结果截断为 3，没有小数。"},
    {kind:"trace", q:"运行后 d 的值是？", code:"double d = 7 / 2;", options:["3.5","3.0","4","编译错误"], answer:1, explain:"先算 `7 / 2`（整数除法）得 3，再赋值给 double 时才变成 3.0。"},
    {kind:"trace", q:"运行后 d 的值是？", code:"double d = (double) 7 / 2;", options:["3.0","3.5","4","2.5"], answer:1, explain:"先把 7 转成 7.0，再除以 2，得 3.5。转换发生在除法之前。"},
    {kind:"trace", q:"运行后 x 的值是？", code:"int x = 4 + 6 / 2;", options:["5","7","8","2"], answer:1, explain:"先算 `6 / 2 = 3`，再算 `4 + 3 = 7`。乘除优先于加减。"},
    {kind:"trace", q:"运行后 x 的值是？", code:"int x = 13 % 5;", options:["2","3","2.6","0"], answer:1, explain:"13 除以 5 商 2 余 3，`%` 取余数，得 3。"},
    {kind:"trace", q:"运行后 y 的值是？", code:"int y = (int) 3.7;", options:["3","4","3.7","编译错误"], answer:0, explain:"强制类型转换 `(int)` 直接截断小数部分，得 3（不是四舍五入）。"},
    {kind:"trace", q:"运行后 x 的值是？", code:"int x = 5;\nx = x + 2;\nx += 3;", options:["10","8","7","5"], answer:0, explain:"x 从 5 → 7 → 10。`x += 3` 等价于 `x = x + 3`。"},
    {kind:"mcq", q:"下面哪个是合法的 double 变量声明？", options:["double x = 5;","int x = 3.5;","double x = 2.0 / 0;","double = 3.14;"], answer:0, explain:"int 可以自动提升为 double，所以 `double x = 5` 合法（得 5.0）。`int x = 3.5` 编译错误；`double = 3.14` 缺少变量名。"},
    {kind:"mcq", q:"哪个表达式的结果是 double 类型？", options:["5 + 3","7 / 2","2 * 3","2.0 + 3"], answer:3, explain:"只要有一个操作数是 double，结果就是 double。`2.0 + 3` 得 5.0。其余都是 int。"},
    {kind:"trace", q:"运行后 b 的值是？", code:"int n = 8;\nboolean b = (n % 2 == 0);", options:["true","false","0","编译错误"], answer:0, explain:"8 % 2 = 0，`0 == 0` 为 true，所以 b = true。判断偶数常用这个写法。"},
  ],
});

UNITS.push({
  id: 2, title: "Using Objects", cn: "使用对象", icon: "🧵",
  objective: "掌握 String、Math、包装类与 null",
  lesson: [
    {t:"h", text:"String 字符串"},
    {t:"p", text:"`String` 是**对象**（引用类型），所以方法调用要带括号，如 `s.length()`。字符串一旦创建就不可改变（immutable），任何操作都返回一个新字符串。"},
    {t:"h", text:"String 常用方法（必背）"},
    {t:"c", code:"String s = \"computer\";\n" +
                    "s.length()                 → 8\n" +
                    "s.substring(1, 4)          → \"omp\"   // [1,4)，取前不含后\n" +
                    "s.substring(4)             → \"uter\"  // 从 4 到结尾\n" +
                    "s.indexOf(\"p\")             → 2       // 首次出现位置，找不到 -1\n" +
                    "s.charAt(0)                → 'c'\n" +
                    "s.equals(\"computer\")       → true    // 比较内容\n" +
                    "s.compareTo(\"dog\")         → 负数    // 字典序比较"},
    {t:"warn", text:"比较两个 String 的内容**必须用 `.equals()`**。用 `==` 比较的是对象的引用地址，内容相同的两个字符串 `==` 也可能为 false。这是 AP 每年必挖的坑。"},
    {t:"h", text:"索引从 0 开始"},
    {t:"p", text:"字符串的字符位置从 `0` 开始编号。`substring(a, b)` 取的是 `[a, b)`，即包含 a、不包含 b。所以截取长度是 `b - a`。"},
    {t:"h", text:"包装类 Integer / Double"},
    {t:"c", code:"Integer.MAX_VALUE   → 2147483647\n" +
                    "Integer.MIN_VALUE   → -2147483648\n" +
                    "int a = Integer.parseInt(\"42\");  // 字符串转整数"},
    {t:"h", text:"Math 类"},
    {t:"c", code:"Math.abs(-5)      → 5\n" +
                    "Math.pow(2, 3)    → 8.0\n" +
                    "Math.sqrt(16)     → 4.0\n" +
                    "Math.random()     → [0.0, 1.0) 之间的随机小数\n" +
                    "Math.max(3, 9)    → 9"},
    {t:"tip", text:"`(int)(Math.random() * n)` 得到 `0` 到 `n-1` 的随机整数；`(int)(Math.random() * 6) + 1` 得到 `1` 到 `6`（模拟骰子）。"},
    {t:"h", text:"null"},
    {t:"p", text:"`null` 表示“没有指向任何对象”。在 null 上调用方法会抛出 `NullPointerException`（运行时错误）。"},
    {t:"li", items:["String 是对象，方法带括号：`length()`、`substring()`、`indexOf()`、`charAt()`","比较内容用 `.equals()`，不要用 `==`","索引从 0 开始，`substring(a,b)` 是 [a,b)","`Math.random()` 返回 [0.0, 1.0) 的小数"]},
  ],
  questions: [
    {kind:"trace", q:"运行后结果是？", code:"System.out.println(\"computer\".length());", options:["7","8","9","编译错误"], answer:1, explain:"computer 有 8 个字符，`length()` 返回 8。"},
    {kind:"trace", q:"运行后结果是？", code:"System.out.println(\"hello\".substring(1, 3));", options:["he","ell","el","llo"], answer:2, explain:"`substring(1,3)` 取索引 [1,3)，即字符 1 和 2：`e` 和 `l`，得 \"el\"。"},
    {kind:"trace", q:"运行后结果是？", code:"System.out.println(\"banana\".indexOf(\"na\"));", options:["2","3","4","-1"], answer:0, explain:"\"na\" 首次出现在索引 2（b=0,a=1,n=2）。indexOf 返回第一次出现的位置。"},
    {kind:"trace", q:"运行后结果是？", code:"System.out.println(\"hello\".charAt(1));", options:["h","e","l","o"], answer:1, explain:"索引从 0 开始：h=0, e=1。charAt(1) 返回 'e'。"},
    {kind:"mcq", q:"判断两个字符串内容是否相同，应该用？", options:["a == b","a.equals(b)","a = b","a.compareTo(b) == 1"], answer:1, explain:"`.equals()` 比较内容；`==` 比较引用地址；`=` 是赋值。"},
    {kind:"trace", q:"运行后结果是？", code:"System.out.println(\"apple\".compareTo(\"banana\") < 0);", options:["true","false","0","编译错误"], answer:0, explain:"apple 在字典序上排在 banana 前面，compareTo 返回负数，负数 < 0 为 true。"},
    {kind:"trace", q:"运行后结果是？", code:"System.out.println(Math.pow(2, 3));", options:["8","8.0","6","9"], answer:1, explain:"Math.pow(2,3) = 2³ = 8.0（返回 double 类型）。"},

UNITS.push({

    {t:"h", text:"什么是递归"},
    {t:"p", text:"递归是**方法自己调用自己**。任何递归都必须有两个要素：① **基本情况（base case）**——停止条件；② **递归调用**——每次向基本情况逼近一步。"},
    {t:"c", code:"public int fact(int n) {\n" +
                    "    if (n <= 1) return 1;        // ① 基本情况\n" +
                    "    return n * fact(n - 1);     // ② 递归调用，n 越来越小\n" +
                    "}\n" +
                    "fact(3) = 3 * fact(2) = 3 * 2 * fact(1) = 3 * 2 * 1 = 6"},
    {t:"warn", text:"没有基本情况（或永远达不到）会导致**无限递归**，最终抛出 `StackOverflowError`。追踪递归题先找“什么时候停”。"},
    {t:"h", text:"递归追踪技巧"},
    {t:"p", text:"从最外层往里展开，到基本情况后再往回计算。例如 `mystery(3)`：`3 + mystery(2)` → `3 + 2 + mystery(1)` → 到达 base case 后逐层返回。"},
    {t:"c", code:"public int mystery(int n) {\n" +
                    "    if (n == 0) return 0;              // base case\n" +
                    "    return n + mystery(n - 1);\n" +
                    "}\n" +
                    "mystery(3) = 3+2+1+0 = 6"},
    {t:"h", text:"AP 相关的递归算法"},
    {t:"p", text:"AP CSA 要求了解**归并排序（merge sort）**和**二分查找（binary search）**的递归思想：merge sort 把数组不断对半拆分再合并；binary search 每次把搜索范围缩小一半。"},
    {t:"li", items:["递归 = 基本情况 + 递归调用","先找 base case（停止条件）","每次递归必须向 base case 逼近","无限递归抛 StackOverflowError"]},
  ],
  questions: [
    {kind:"trace", q:"运行后 mystery(3) 的返回值是？", code:"public int mystery(int n) {\n    if (n == 0) return 0;\n    return n + mystery(n - 1);\n}", options:["6","3","0","10"], answer:0, explain:"3 + 2 + 1 + 0 = 6。"},

    {kind:"mcq", q:"递归方法中，基本情况（base case）的作用是？", options:["让程序更快","停止递归","增加栈空间","避免编译错误"], answer:1, explain:"base case 是停止条件，防止无限递归。"},
    {kind:"trace", q:"运行后 f(5) 的返回值是？", code:"public int f(int n) {\n    if (n == 1) return 1;\n    return n + f(n - 2);\n}", options:["9","6","15","1"], answer:0, explain:"f(5)=5+f(3)=5+3+f(1)=5+3+1=9。"},

<script>
/* ============================================================
   应用逻辑
   ============================================================ */
const KEY = "apcsa_v1";
const $  = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function inline(s){ return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }
function hl(code){
  const re = /(\/\/[^\n]*)|(&quot;(?:[^&]|&(?!quot;))*?&quot;)|(&#39;[^&]*?&#39;)|\b(public|private|protected|static|final|void|int|double|boolean|char|String|byte|short|long|float|class|interface|extends|implements|new|return|if|else|for|while|do|switch|case|break|continue|this|super|true|false|null|import|package|instanceof)\b|\b(\d+(?:\.\d+)?)\b/g;
  return esc(code).replace(re, (m, cm, st, ch, kw, num) => {
    if (cm) return '<span class="cm">'+cm+'</span>';
    if (st) return '<span class="st">'+st+'</span>';
    if (ch) return '<span class="st">'+ch+'</span>';
    if (kw) return '<span class="kw">'+kw+'</span>';
    if (num) return '<span class="num">'+num+'</span>';
    return m;
  });
}
function renderBlocks(blocks){
  return blocks.map(b => {
    if (b.t === "h") return "<h3>"+inline(b.text)+"</h3>";
    if (b.t === "p") return "<p class='body'>"+inline(b.text)+"</p>";
    if (b.t === "c") return "<div class='block-code'>"+hl(b.code)+"</div>";
    if (b.t === "tip") return "<div class='callout tip'><span class='ico'>💡</span><div>"+inline(b.text)+"</div></div>";
    if (b.t === "warn") return "<div class='callout warn'><span class='ico'>⚠️</span><div>"+inline(b.text)+"</div></div>";
    if (b.t === "err") return "<div class='callout err'><span class='ico'>❌</span><div>"+inline(b.text)+"</div></div>";
    if (b.t === "li") return "<ul class='li'>"+b.items.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>";
    if (b.t === "table") return "<div class='table-wrap'><table>"+b.rows.map((r,i)=> "<tr>"+r.map((c,j)=> (i===0?"<th>":"<td>")+inline(c)+(i===0?"</th>":"</td>")).join("")+"</tr>").join("")+"</table></div>";
    return "";
  }).join("");
}

/* ---------- 状态 ---------- */
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function defaultState(){ return {xp:0, lastDay:todayStr(), streak:1, badges:[], lessonsRead:{}, q:{}, quizDone:{}, frqDone:{}, examBest:null, examAttempts:0}; }
let state;
try{ state = JSON.parse(localStorage.getItem(KEY)) || defaultState(); }catch(e){ state = defaultState(); }
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function todayStr2(){ return state.lastDay; }
function updateStreak(){
  const t = todayStr();
  if (state.lastDay === t) return;
  const y = new Date(Date.now()-86400000);
  const ystr = y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
  state.streak = (state.lastDay === ystr) ? state.streak+1 : 1;
  state.lastDay = t;
}
function level(){ return Math.min(25, Math.floor(state.xp/150)+1); }
function levelTitle(){ return LEVEL_TITLES[Math.min(LEVEL_TITLES.length-1, level()-1)]; }
function gid(uid, qi){ return uid+":"+qi; }

/* ---------- 积分与徽章 ---------- */
function addXP(n){ if(n>0){ state.xp += n; } }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove("show"), 2600); }
function checkBadges(){
  const earned = new Set(state.badges);
  const has = id => earned.has(id);
  const unitDone = uid => (state.quizDone[uid] === true);
  const doneUnits = UNITS.filter(u=>unitDone(u.id)).length;
  const perfect = UNITS.some(u=> unitDone(u.id) && u.questions.every((q,i)=> state.q[gid(u.id,i)] && state.q[gid(u.id,i)].ft === true));

  const newOnes = [];
  const test = (id, cond) => { if(!has(id) && cond){ state.badges.push(id); newOnes.push(id); } };
  test("first_xp", state.xp >= 10);
  test("unit1", doneUnits >= 1);
  test("five", doneUnits >= 5);
  test("all", doneUnits >= UNITS.length && UNITS.length>0);
  test("perfect", perfect);
  test("streak7", state.streak >= 7);
  test("exam80", state.examBest !== null && state.examBest >= 80);
  test("level5", level() >= 5);
  if(newOnes.length){
    save();
    const names = newOnes.map(id => BADGES.find(b=>b.id===id).name).join("、");
    toast("🏅 获得徽章：" + names);
  }
}

/* ---------- 题目统计 ---------- */
function qStatus(uid, qi){ return state.q[gid(uid,qi)] || null; }
function unitStats(unit){
  let correct=0, attempted=0, firstTryRight=0;
  unit.questions.forEach((q,i)=>{
    const s = qStatus(unit.id, i);
    if(s){ attempted++; if(s.correct) correct++; if(s.ft) firstTryRight++; }
  });
  return {correct, attempted, total:unit.questions.length, firstTryRight};
}
function overallStats(){
  let correct=0, total=0;
  UNITS.forEach(u=>{ const s=unitStats(u); correct+=s.correct; total+=s.total; });
  return total ? Math.round(correct/total*100) : 0;
}
function flattenAll(){
  const arr=[];
  UNITS.forEach(u=> u.questions.forEach((q,i)=> arr.push({q, uid:u.id, qi:i, unit:u})));
  return arr;
}

let view = {name:"home"};
let quizSession = null;   // {uid, idx, order, locked}
let examSession = null;

function nav(){
  const sb = $("#sidebar");
  let html = '<button class="nav-btn" data-go="home">🏠 首页</button>';
  html += '<div class="nav-group">学习单元</div>';
  UNITS.forEach(u=>{
    const st = unitStats(u);
    const done = state.quizDone[u.id];
    html += '<button class="nav-btn'+(view.name==="unit"&&view.uid===u.id?" active":"")+(done?" done":"")+'" data-go="unit" data-uid="'+u.id+'">'+
      '<span class="dot"></span><span>'+u.icon+' '+u.cn+'</span></button>';
  });
  html += '<div class="nav-group">综合</div>';
  html += '<button class="nav-btn'+(view.name==="frq"?" active":"")+'" data-go="frq">📝 FRQ 练习</button>';
  html += '<button class="nav-btn'+(view.name==="exam"?" active":"")+'" data-go="exam">🎯 模拟考试</button>';
  html += '<button class="nav-btn'+(view.name==="cheat"?" active":"")+'" data-go="cheat">📋 速查表</button>';
  sb.innerHTML = html;
}
function refreshHeader(){
  $("#stat-level").textContent = "Lv."+level()+" "+levelTitle();
  $("#stat-xp").textContent = state.xp+" XP";
  $("#stat-streak").textContent = "🔥 "+state.streak+" 天";
  $("#stat-pct").textContent = overallStats()+"% 掌握";
}
function go(name, params={}){
  view = {name, ...params};
  if(name==="unit"){ quizSession=null; }
  examSession = null;
  nav(); render(); window.scrollTo({top:0, behavior:"smooth"});
}
function render(){ refreshHeader(); const m=$("#main");
  if(view.name==="home") m.innerHTML = homeHTML();
  else if(view.name==="unit") m.innerHTML = unitHTML();
  else if(view.name==="quiz") m.innerHTML = quizHTML();
  else if(view.name==="frq") m.innerHTML = frqHTML();
  else if(view.name==="exam") m.innerHTML = examHTML();
  else if(view.name==="cheat") m.innerHTML = cheatHTML();
  else if(view.name==="unitresult") m.innerHTML = resultHTML();
}

/* ================= 首页 ================= */
function homeHTML(){
  const done = UNITS.filter(u=>state.quizDone[u.id]).length;
  const s = overallStats();
  let cards = UNITS.map(u=>{
    const st = unitStats(u);
    const pct = st.total? Math.round(st.correct/st.total*100):0;
    return '<div class="unit-card" data-go="unit" data-uid="'+u.id+'">'+
      '<span class="bar"><i style="width:'+pct+'%"></i></span>'+
      '<div class="icon">'+u.icon+'</div><h3>'+u.cn+'</h3>'+
      '<div class="cn">'+u.title+'</div><div class="pct">'+st.correct+'/'+st.total+' 题 · '+pct+'%</div></div>';
  }).join("");
  const earned = BADGES.filter(b=>state.badges.includes(b.id));
  const badgesHTML = BADGES.map(b=>{
    const e = state.badges.includes(b.id);
    return '<div class="badge'+(e?" earned":"")+'"><span class="b-ico">'+b.ico+'</span><b>'+b.name+'</b><span class="muted">'+b.desc+'</span></div>';
  }).join("");

  return ''+
  '<div class="hero"><h1>你好！一起拿下 AP CSA 👋</h1>'+
  '<p>这套课程按 <b>College Board 官方大纲的 10 个单元</b> 编排，从最基础的变量讲起。每个单元先学知识点，再做即时反馈的练习题；全部学完后去做 FRQ 和模拟考试。</p>'+
  '<div class="row"><button class="btn" data-go="unit" data-uid="'+(UNITS[0]?UNITS[0].id:1)+'">🚀 开始学习</button>'+
  '<button class="btn ghost" data-go="random">🎲 随机练习一题</button></div></div>'+
  '<div class="card"><div class="spread"><h2 style="margin:0">📚 课程单元</h2><span class="muted">已完成 '+done+' / '+UNITS.length+'</span></div>'+
  '<div class="pbar" style="margin:14px 0"><i style="width:'+s+'%"></i></div>'+
  '<div class="unit-grid">'+cards+'</div></div>'+
  '<div class="card"><h2 style="margin-top:0">🏅 我的徽章</h2><div class="badges">'+badgesHTML+'</div></div>';
}

/* ================= 单元 ================= */

function lessonHTML(u, read){

  '<div style="margin-top:20px" class="spread">'+
  '<button class="btn" data-tab="quiz">✏️ 去做练习 →</button>'+

/* ================= 练习 ================= */
function startQuiz(uid){
  const u = UNITS.find(x=>x.id===uid);
  quizSession = {uid, idx:0, order:u.questions.map((_,i)=>i)};
}
function quizHTML(u, idx){
  if(!u) return "";
  if(!quizSession){ startQuiz(u.id); }
  const s = quizSession;
  const qi = s.order[s.idx];
  const q = u.questions[qi];
  const st = qStatus(u.id, qi);
  const answered = !!st;
  const total = s.order.length;
  let opts = "";
  if(q.options){
    opts = '<div class="options">'+q.options.map((o,i)=>{
      let cls="opt"; let ltr="ABCD"[i];
      if(answered){
        cls += " disabled";
        if(i===q.answer) cls += " correct";
        else if(i===st.picked) cls += " wrong";
      }
      return '<button class="'+cls+'" data-opt="'+i+'"><span class="ltr">'+ltr+'.</span><span>'+inline(o)+'</span></button>';
    }).join("")+'</div>';
  }
  const explain = answered ? '<div class="explain '+(st.correct?"good":"bad")+'"><b>'+(st.correct?"✅ 回答正确！":"❌ 回答错误")+'</b>'+inline(q.explain)+'</div>' : "";
  const nextBtn = answered ? '<button class="btn" data-next>'+(s.idx < total-1 ? "下一题 →" : "查看结果 🎉")+'</button>' : "";
  return ''+
  '<div class="card"><div class="spread" style="margin-bottom:10px">'+
  '<span class="q-meta">第 '+(s.idx+1)+' / '+total+' 题 · '+(q.kind==="trace"?"🔍 代码追踪":"🧩 概念题")+'</span>'+
  '<span class="muted" style="font-size:13px">已掌握 '+unitStats(u).correct+'/'+total+'</span></div>'+
  '<div class="q-text">'+inline(q.q)+'</div>'+
  (q.code ? '<div class="block-code">'+hl(q.code)+'</div>' : "")+
  opts + explain +
  '<div style="margin-top:16px" class="row">'+nextBtn+
  '<button class="btn ghost sm" data-tab="lesson">← 返回知识点</button></div></div>';
}
function answerQuestion(opt){
  const u = UNITS.find(x=>x.id===quizSession.uid);
  const qi = quizSession.order[quizSession.idx];
  const q = u.questions[qi];
  const key = gid(u.id, qi);
  const prev = state.q[key];
  const correct = opt === q.answer;
  const firstTime = !prev;
  const wasWrong = prev && !prev.correct;

  if(firstTime){
    if(correct){ addXP(10); state.q[key]={correct:true, ft:true, picked:opt}; toast("+10 XP 🎉"); }
    else{ state.q[key]={correct:false, ft:false, picked:opt}; toast("再想想，看看解析吧 💪"); }
  } else if(wasWrong && correct){
    addXP(4); state.q[key]={correct:true, ft:prev.ft, picked:opt}; toast("+4 XP 改正成功 ✅");
  } else if(wasWrong && !correct){
    state.q[key]={correct:false, ft:false, picked:opt};
  } else {
    state.q[key].picked = opt; // 已正确，随意重看
  }
  save(); render();
}
function nextQuestion(){
  const u = UNITS.find(x=>x.id===quizSession.uid);
  const total = quizSession.order.length;
  if(quizSession.idx < total-1){ quizSession.idx++; render(); return; }
  const st = unitStats(u);
  const allCorrect = st.correct === total;
  const perfect = st.firstTryRight === total;
  if(!state.quizDone[u.id]){
    state.quizDone[u.id] = true;
    addXP(20);
    if(allCorrect){ toast("🎊 完成本单元！+20 XP"); if(perfect) confetti(); }
    else { toast("📦 完成本单元（可随时回来补错题）+20 XP"); }
    save(); checkBadges();
  }
  quizSession = null;
  view = {name:"unitresult", uid:u.id};
  nav(); render();
}
function resultHTML(){
  const u = UNITS.find(x=>x.id===view.uid);
  const st = unitStats(u);
  const pct = Math.round(st.correct/st.total*100);
  const perfect = st.firstTryRight === st.total;
  const nextU = UNITS.find(x=>x.id===u.id+1);
  return '<div class="card" style="border-color:'+(pct>=80?'var(--good)':'var(--warn)')+'">'+
  '<h1 style="margin:0">'+u.icon+' '+u.cn+' · 单元完成</h1>'+
  '<p class="sub">答对 '+st.correct+' / '+st.total+' 题，正确率 <b style="font-size:22px">'+pct+'%</b>'+(perfect?" · 一次全对 💯":"")+'</p>'+
  '<div class="pbar'+(pct>=80?" good":"")+'" style="margin:14px 0"><i style="width:'+pct+'%"></i></div>'+
  '<p class="body">'+(pct>=80 ? "太棒了！继续下一个单元，或去挑战模拟考试。" : "错题是进步最快的路——点“再做一次”把错题搞懂，就能冲高分。")+'</p>'+
  '<div class="row"><button class="btn" data-retry="'+u.id+'">🔁 再做一次</button>'+
  '<button class="btn ghost" data-go="unit" data-uid="'+u.id+'">📖 复习知识点</button>'+
  (nextU ? '<button class="btn" data-go="unit" data-uid="'+nextU.id+'">下一个单元 →</button>' : '<button class="btn" data-go="exam">🎯 去模考</button>')+
  '</div></div>';
}

function revealFRQ(which){
  const f = FRQS.find(x=>x.id===view.id);
  const box = $("#frq-reveal");
  if(which==="answer"){
    box.innerHTML = '<h2>参考答案</h2>'+(f.answerText?'<p class="body">'+inline(f.answerText)+'</p>':"")+'<div class="block-code">'+hl(f.answer)+'</div>';
  } else {
    box.innerHTML = '<div class="rubric"><b>📊 评分要点（每点对应阅卷给分）</b><ul class="li">'+f.points.map(p=>'<li>'+inline(p)+'</li>').join("")+'</ul></div>';
  }
}

/* ================= 模拟考试 ================= */
function examHTML(){
  if(!examSession) return examIntroHTML();
  if(view.finished) return examResultHTML();
  const s = examSession;
  const item = s.items[s.idx];
  const answered = s.picked[s.idx] !== undefined;
  return '<div class="card"><div class="spread" style="margin-bottom:10px">'+
  '<span class="q-meta">模考第 '+(s.idx+1)+' / '+s.items.length+' 题</span>'+
  '<span class="muted" style="font-size:13px">⏱️ '+examClock()+'</span></div>'+
  '<div class="q-text">'+inline(item.q.q)+'</div>'+
  (item.q.code?'<div class="block-code">'+hl(item.q.code)+'</div>':"")+
  '<div class="options">'+item.q.options.map((o,i)=>{
    let cls="opt"; if(answered){ cls+=" disabled"; if(i===s.picked[s.idx]) cls+=" active"; }
    return '<button class="'+cls+'" data-examopt="'+i+'"><span class="ltr">'+"ABCD"[i]+'.</span><span>'+inline(o)+'</span></button>';
  }).join("")+'</div>'+
  '<div style="margin-top:16px" class="row">'+
  (answered ? (s.idx<s.items.length-1?'<button class="btn" data-examnext>下一题 →</button>':'<button class="btn" data-examfinish>交卷 🏁</button>') : '<span class="muted" style="font-size:13px">选择一个答案后继续</span>')+
  '</div></div>';
}
function examIntroHTML(){
  const best = state.examBest;
  return '<div class="card"><h1>🎯 模拟考试</h1>'+
  '<p class="sub">随机抽取 '+(Math.min(30, flattenAll().length))+' 道覆盖全部单元的选择题。真实考试 MCQ 部分是 40 题 / 90 分钟，这里先热身。</p>'+
  '<div class="callout tip"><span class="ico">⏱️</span><div>建议计时 30 分钟完成。答完可查看每一题的解析，错题会是你考前最该复习的清单。</div></div>'+
  (best!==null? '<p class="body">历史最佳：<b>'+best+'%</b>（共 '+state.examAttempts+' 次）</p>':'<p class="body">还没有模考记录，来第一次挑战吧！</p>')+
  '<button class="btn" data-startexam>▶️ 开始考试</button></div>';
}
function startExam(){
  const pool = flattenAll();
  const shuffled = [...pool].sort(()=>Math.random()-0.5).slice(0, Math.min(30, pool.length));
  examSession = {items: shuffled, idx:0, picked: [], start: Date.now()};
  state.examAttempts++;
  save(); render();
}
function examClock(){
  const sec = Math.floor((Date.now()-examSession.start)/1000);
  return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
}
function examPick(opt){ examSession.picked[examSession.idx] = opt; render(); }
function examNext(){ examSession.idx++; render(); }
function finishExam(){
  const s = examSession;
  const score = s.items.reduce((acc,it,i)=> acc + (s.picked[i]===it.q.answer?1:0), 0);
  const pct = Math.round(score/s.items.length*100);
  if(state.examBest===null || pct>state.examBest){ state.examBest=pct; }
  view.finished = true; view.score=score; view.total=s.items.length; view.pct=pct;
  save(); checkBadges(); render();
  if(pct>=80) confetti();
}
function examResultHTML(){
  const pct = view.pct;
  const s = examSession;
  const wrong = s.items.map((it,i)=>({it,i})).filter(x=> s.picked[x.i] !== x.it.q.answer);
  return '<div class="card"><h1>'+(pct>=80?"🏆 太厉害了！":"📊 模考完成")+'</h1>'+
  '<p class="sub">答对 '+view.score+' / '+view.total+' 题，正确率 <b style="font-size:22px">'+pct+'%</b></p>'+
  '<div class="pbar'+(pct>=80?" good":"")+'" style="margin:14px 0"><i style="width:'+pct+'%"></i></div>'+
  (pct>=80 ? '<div class="callout tip"><span class="ico">🎉</span><div>已经达到 5 分水平线！去把 FRQ 也过一遍就能上考场了。</div></div>' :
   '<div class="callout warn"><span class="ico">💪</span><div>别灰心，错题就是提分点。下面是错题清单，回到对应单元再巩固一遍。</div></div>')+
  '<h2>错题回顾</h2>'+
  (wrong.length===0 ? '<p class="sub">全部答对，没有错题！👏</p>' :
    wrong.map(w=> '<div style="margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:12px">'+
      '<b>'+w.it.unit.cn+'：</b>'+inline(w.it.q.q)+
      (w.it.q.code?'<div class="block-code">'+hl(w.it.q.code)+'</div>':"")+
      '<div class="muted" style="font-size:13px">你的答案：'+(s.picked[w.i]!==undefined?"ABCD"[s.picked[w.i]]:"未作答")+' · 正确答案：'+"ABCD"[w.it.q.answer]+'</div>'+
      '<div class="muted" style="font-size:13px">'+inline(w.it.q.explain)+'</div></div>').join("")
  )+
  '<div class="row" style="margin-top:16px"><button class="btn" data-go="exam">🔁 再考一次</button>'+
  '<button class="btn ghost" data-go="home">🏠 回首页</button></div></div>';
}

/* ================= 彩带 ================= */
function confetti(){
  const colors = ["#6366f1","#8b5cf6","#10b981","#f59e0b","#ef4444","#ec4899","#06b6d4"];
  for(let i=0;i<90;i++){
    const d=document.createElement("div");
    d.className="confetti";
    d.style.left=Math.random()*100+"vw";
    d.style.width=(6+Math.random()*8)+"px";
    d.style.height=(10+Math.random()*10)+"px";
    d.style.background=colors[Math.floor(Math.random()*colors.length)];
    d.style.animationDuration=(2.2+Math.random()*2)+"s";
    d.style.animationDelay=(Math.random()*0.6)+"s";
    d.style.borderRadius=Math.random()>0.5?"50%":"2px";
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 5000);
  }
}

/* ================= 事件绑定 ================= */
document.addEventListener("click", e=>{
  const t = e.target;
  const goBtn = t.closest("[data-go]");
  if(goBtn){
    if(goBtn.dataset.go==="unit"){ go("unit", {uid:+goBtn.dataset.uid, tab:"lesson"}); return; }
    if(goBtn.dataset.go==="frq" && goBtn.dataset.fid){ go("frq", {id:+goBtn.dataset.fid}); return; }
    if(goBtn.dataset.go==="random"){ view={name:"random"}; nav(); $("#main").innerHTML = randomHTML(); return; }
    go(goBtn.dataset.go);
    return;
  }
  const tabBtn = t.closest("[data-tab]");
  if(tabBtn){ view.tab = tabBtn.dataset.tab; if(view.name==="unit") render(); return; }
  const mark = t.closest("[data-markread]");
  if(mark){
    const uid = +mark.dataset.markread;
    if(!state.lessonsRead[uid]){ state.lessonsRead[uid]=true; addXP(5); toast("+5 XP 完成学习 ✅"); save(); }
    else { state.lessonsRead[uid]=false; save(); }
    render(); return;
  }
  const opt = t.closest("[data-opt]");
  if(opt){ answerQuestion(+opt.dataset.opt); return; }
  const nx = t.closest("[data-next]");
  if(nx){ nextQuestion(); return; }
  const retry = t.closest("[data-retry]");
  if(retry){ startQuiz(+retry.dataset.retry); view = {name:"unit", uid:+retry.dataset.retry, tab:"quiz"}; nav(); render(); return; }
  const reveal = t.closest("[data-reveal]");
  if(reveal){ revealFRQ(reveal.dataset.reveal); return; }
  const frqdone = t.closest("[data-frqdone]");
  if(frqdone){ state.frqDone[+frqdone.dataset.frqdone]=true; save(); toast("🎉 完成一道 FRQ！"); render(); return; }
  const se = t.closest("[data-startexam]");
  if(se){ startExam(); return; }
  const eo = t.closest("[data-examopt]");
  if(eo){ examPick(+eo.dataset.examopt); return; }
  const en = t.closest("[data-examnext]");
  if(en){ examNext(); return; }
  const ef = t.closest("[data-examfinish]");
  if(ef){ finishExam(); return; }
  const ro = t.closest("[data-randopt]");
  if(ro){ answerRandom(+ro.dataset.randopt); return; }
});

/* 随机练习答题（简化版） */
let randomCurrent = null;
function answerRandom(opt){
  if(!randomCurrent) return;
  const pick = randomCurrent;
  const key = gid(pick.uid, pick.qi);
  const prev = state.q[key];
  const correct = opt === pick.q.answer;
  if(!prev){
    if(correct){ addXP(10); state.q[key]={correct:true,ft:true,picked:opt}; toast("+10 XP 🎉"); }
    else{ state.q[key]={correct:false,ft:false,picked:opt}; }
  } else if(!prev.correct && correct){
    addXP(4); state.q[key]={correct:true,ft:prev.ft,picked:opt}; toast("+4 XP ✅");
  } else if(!prev.correct && !correct){
    state.q[key]={correct:false,ft:false,picked:opt};
  } else { state.q[key].picked=opt; }
  save(); nav(); $("#main").innerHTML = randomHTML();
}

/* 随机练习：记录当前题目以便答题 */
function randomHTML(){
  const pool = flattenAll();
  const pick = pool[Math.floor(Math.random()*pool.length)];
  randomCurrent = pick;
  const st = qStatus(pick.uid, pick.qi);
  const answered = !!st;
  return '<div class="card"><div class="spread" style="margin-bottom:10px">'+
  '<span class="q-meta">🎲 随机练习 · 来自「'+pick.unit.cn+'」</span>'+
  '<button class="btn ghost sm" data-go="unit" data-uid="'+pick.uid+'">去该单元 →</button></div>'+
  '<div class="q-text">'+inline(pick.q.q)+'</div>'+
  (pick.q.code?'<div class="block-code">'+hl(pick.q.code)+'</div>':"")+
  '<div class="options">'+pick.q.options.map((o,i)=>{
    let cls="opt"; if(answered){ cls+=" disabled"; if(i===pick.q.answer)cls+=" correct"; else if(i===st.picked)cls+=" wrong"; }
    return '<button class="'+cls+'" data-randopt="'+i+'"><span class="ltr">'+"ABCD"[i]+'.</span><span>'+inline(o)+'</span></button>';
  }).join("")+'</div>'+
  (answered?'<div class="explain '+(st.correct?"good":"bad")+'"><b>'+(st.correct?"✅ 正确":"❌ 错误")+'</b>'+inline(pick.q.explain)+'</div>':"")+
  '<div style="margin-top:14px" class="row">'+(answered?'<button class="btn" data-go="random">🎲 再来一题</button>':'')+
  '<button class="btn ghost" data-go="home">🏠 回首页</button></div></div>';
};

/* ================= 启动 ================= */
function init(){
  updateStreak();
  // 兼容旧状态字段
  if(!state.q) state.q={};
  if(!state.lessonsRead) state.lessonsRead={};
  if(!state.quizDone) state.quizDone={};
  if(!state.frqDone) state.frqDone={};
  if(state.badges===undefined) state.badges=[];
  save();
  nav(); render(); checkBadges();
}
init();
</script>
