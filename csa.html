<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP CSA 学习平台 · Java 从零到 5 分</title>
<style>  :root{
    --bg:#eef1f8; --card:rgba(255,255,255,0.30); --line:rgba(0,0,0,0.08);
    --text:#1c1c1e; --muted:#6e6e73; --soft:#9a9aa0;
    --accent:#0a84ff; --accent2:#5e5ce6; --accent-soft:rgba(10,132,255,0.10);
    --good:#34c759; --good-soft:rgba(52,199,89,0.14); --bad:#ff3b30; --bad-soft:rgba(255,59,48,0.12);
    --warn:#ff9500; --warn-soft:rgba(255,149,0,0.14); --code-bg:#f2f4f9; --code-text:#1c1c1e;
    --radius:22px; --shadow:0 18px 40px rgba(60,80,160,0.16), 0 4px 14px rgba(60,80,160,0.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"SF Pro Text",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1100px 800px at 88% -12%, rgba(94,92,230,0.22), transparent 55%),
      radial-gradient(950px 750px at -8% 12%, rgba(10,132,255,0.20), transparent 55%),
      radial-gradient(900px 700px at 50% 115%, rgba(52,199,89,0.15), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text); line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  code,.mono{font-family:"SF Mono","Cascadia Code",Consolas,"Courier New",monospace;}
  button{font-family:inherit; cursor:pointer; border:none; color:inherit;}

  /* ---------- 顶栏（玻璃） ---------- */
  header{
    position:sticky; top:0; z-index:30;
    background:rgba(255,255,255,0.32);
    backdrop-filter:blur(28px) saturate(180%); -webkit-backdrop-filter:blur(28px) saturate(180%);
    border-bottom:1px solid rgba(255,255,255,0.6);
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 22px; gap:12px;
    box-shadow:0 1px 0 rgba(0,0,0,0.03);
  }
  .brand{font-weight:700; font-size:18px; letter-spacing:.2px; white-space:nowrap; color:var(--text);}
  .brand small{font-weight:500; color:var(--muted); font-size:12px; margin-left:8px;}
  .stats{display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end;}
  .stat{
    background:rgba(255,255,255,0.5); border:1px solid rgba(255,255,255,0.6);
    padding:5px 12px; border-radius:999px; font-weight:600; font-size:13px; white-space:nowrap;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }

  /* ---------- 布局 ---------- */
  .layout{display:flex; max-width:1180px; margin:0 auto; gap:22px; padding:22px; min-height:calc(100vh - 60px);}
  aside{width:232px; flex-shrink:0;}
  main{flex:1; min-width:0;}

  /* ---------- 侧边栏（玻璃） ---------- */
  #sidebar{
    position:sticky; top:82px; display:flex; flex-direction:column; gap:6px;
    background:var(--card); backdrop-filter:blur(28px) saturate(180%); -webkit-backdrop-filter:blur(28px) saturate(180%);
    border:1px solid rgba(255,255,255,0.6); border-radius:var(--radius);
    padding:14px; box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .nav-btn{
    text-align:left; background:none; padding:9px 12px; border-radius:12px;
    font-size:14px; color:var(--text); transition:.15s; display:flex; align-items:center; gap:8px;
  }
  .nav-btn:hover{background:rgba(255,255,255,0.6);}
  .nav-btn.active{
    background:linear-gradient(135deg,#0a84ff,#5e5ce6); color:#fff; font-weight:600;
    box-shadow:0 6px 18px rgba(10,132,255,.28);
  }
  .nav-btn .dot{width:8px; height:8px; border-radius:50%; background:var(--soft); flex-shrink:0;}
  .nav-btn.done .dot{background:var(--good);}
  .nav-group{font-size:11px; color:var(--soft); font-weight:700; letter-spacing:1px; margin:10px 6px 2px; text-transform:uppercase;}

  /* ---------- 卡片（玻璃） ---------- */
  .card{
    background:var(--card); backdrop-filter:blur(28px) saturate(180%); -webkit-backdrop-filter:blur(28px) saturate(180%);
    border:1px solid rgba(255,255,255,0.6); border-radius:var(--radius); padding:24px;
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.7); margin-bottom:18px;
  }
  h1{font-size:26px; font-weight:700; margin-bottom:6px; letter-spacing:-.2px;}
  h2{font-size:20px; font-weight:700; margin:22px 0 10px; letter-spacing:-.2px;}
  h3{font-size:16px; font-weight:700; margin:18px 0 8px; display:flex; align-items:center; gap:8px;}
  .sub{color:var(--muted); font-size:14px;}
  .muted{color:var(--muted);}
  .row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .spread{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}

  .btn{
    display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:14px;
    padding:10px 18px; border-radius:14px; transition:.15s;
    background:linear-gradient(135deg,#0a84ff,#5e5ce6); color:#fff;
    box-shadow:0 4px 14px rgba(10,132,255,.25);
  }
  .btn:hover{transform:translateY(-1px); box-shadow:0 8px 22px rgba(10,132,255,.32);}
  .btn.ghost{background:rgba(255,255,255,0.5); color:var(--accent); border:1px solid rgba(0,0,0,0.08); box-shadow:none;}
  .btn.ghost:hover{background:rgba(255,255,255,0.8);}
  .btn.sm{padding:7px 13px; font-size:13px; border-radius:11px;}
  .btn:disabled{opacity:.5; cursor:not-allowed; transform:none; box-shadow:none;}

  /* ---------- 首页 ---------- */
  .hero{
    background:linear-gradient(135deg,#0a84ff,#5e5ce6,#bf5af2); color:#fff;
    border-radius:var(--radius); padding:32px 30px; margin-bottom:18px;
    box-shadow:0 14px 40px rgba(94,92,230,.3), inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .hero h1{font-size:28px;}
  .hero p{opacity:.95; margin:8px 0 16px; max-width:640px;}
  .unit-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
  .unit-card{
    background:var(--card); backdrop-filter:blur(26px) saturate(180%); -webkit-backdrop-filter:blur(26px) saturate(180%);
    border:1px solid rgba(255,255,255,0.6); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.7);
    transition:.15s; cursor:pointer; position:relative; overflow:hidden;
  }
  .unit-card:hover{transform:translateY(-3px); box-shadow:0 16px 40px rgba(31,38,135,0.14), inset 0 1px 0 rgba(255,255,255,0.7);}
  .unit-card .bar{position:absolute; top:0; left:0; height:4px; width:100%; background:rgba(0,0,0,0.05);}
  .unit-card .bar i{display:block; height:100%; background:linear-gradient(90deg,#34c759,#0a84ff);}
  .unit-card .icon{font-size:30px;}
  .unit-card h3{margin:8px 0 2px; font-size:16px;}
  .unit-card .cn{font-size:13px; color:var(--muted); font-weight:600;}
  .unit-card .pct{font-size:12px; color:var(--soft); margin-top:6px;}

  /* ---------- 进度条 ---------- */
  .pbar{height:10px; background:rgba(0,0,0,0.06); border-radius:999px; overflow:hidden;}
  .pbar i{display:block; height:100%; background:linear-gradient(90deg,#0a84ff,#5e5ce6); border-radius:999px; transition:.4s;}
  .pbar.good i{background:linear-gradient(90deg,#34c759,#0a84ff);}

  /* ---------- 学习块 ---------- */
  .block-code{
    background:var(--code-bg); color:var(--code-text); border:1px solid rgba(0,0,0,0.06); border-radius:14px; padding:16px 18px;
    font-size:14px; line-height:1.6; overflow-x:auto; margin:10px 0; white-space:pre;
  }
  .kw{color:#a855f7; font-weight:600;} .st{color:#16a34a;} .num{color:#dc2626;} .cm{color:#94a3b8; font-style:italic;}
  .callout{border-radius:14px; padding:12px 16px; margin:12px 0; font-size:14px; display:flex; gap:10px;}
  .callout.tip{background:var(--good-soft); border-left:4px solid var(--good);}
  .callout.warn{background:var(--warn-soft); border-left:4px solid var(--warn);}
  .callout.err{background:var(--bad-soft); border-left:4px solid var(--bad);}
  .callout .ico{font-size:18px; line-height:1.4;}
  ul.li{margin:8px 0 8px 4px; padding-left:22px;}
  ul.li li{margin:4px 0;}
  p.body{margin:8px 0; font-size:15px;}
  p.body code, .li code, .explain code, .q-text code{background:var(--accent-soft); color:var(--accent); padding:1px 6px; border-radius:6px; font-size:.92em;}

  .tabs{display:inline-flex; background:rgba(0,0,0,0.05); border-radius:12px; padding:4px; margin-bottom:16px;}
  .tab{padding:8px 18px; border-radius:9px; font-weight:600; font-size:14px; color:var(--muted); background:none;}
  .tab.active{background:#fff; color:var(--accent); box-shadow:0 2px 8px rgba(0,0,0,0.1);}

  /* ---------- 题目 ---------- */
  .q-text{font-size:16px; font-weight:600; margin:4px 0 12px;}
  .q-meta{font-size:12px; color:var(--soft); margin-bottom:6px;}
  .options{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .opt{
    text-align:left; background:rgba(255,255,255,0.5); border:1.5px solid var(--line); border-radius:14px;
    padding:12px 16px; font-size:15px; transition:.12s; display:flex; gap:12px; align-items:flex-start;
  }
  .opt .ltr{font-weight:700; color:var(--accent); flex-shrink:0;}
  .opt:hover{border-color:var(--accent); background:rgba(255,255,255,0.8);}
  .opt.correct{border-color:var(--good); background:var(--good-soft);}
  .opt.wrong{border-color:var(--bad); background:var(--bad-soft);}
  .opt.active{border-color:var(--accent); background:var(--accent-soft);}
  .opt.disabled{pointer-events:none;}
  .explain{margin-top:14px; border-radius:14px; padding:14px 16px; font-size:14px;}
  .explain.good{background:var(--good-soft);}
  .explain.bad{background:var(--bad-soft);}
  .explain b{display:block; margin-bottom:4px;}

  /* ---------- FRQ ---------- */
  textarea{
    width:100%; min-height:140px; border:1.5px solid var(--line); border-radius:14px; background:rgba(255,255,255,0.6); color:var(--text);
    padding:12px; font-size:14px; font-family:inherit; resize:vertical; margin:10px 0;
  }
  textarea:focus{outline:none; border-color:var(--accent); background:#fff;}
  .rubric{background:var(--warn-soft); border-left:4px solid var(--warn); border-radius:14px; padding:14px 16px; margin:10px 0; font-size:14px;}
  .rubric li{margin:5px 0;}
  .checkrow{display:flex; gap:12px; align-items:center; padding:8px 0; border-bottom:1px dashed var(--line);}
  .checkrow input{width:18px; height:18px; accent-color:var(--accent);}

  /* ---------- 徽章 ---------- */
  .badges{display:flex; gap:10px; flex-wrap:wrap;}
  .badge{
    display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px; min-width:86px;
    border-radius:14px; background:rgba(255,255,255,0.5); border:1px solid var(--line); font-size:12px; text-align:center;
  }
  .badge .b-ico{font-size:26px; filter:grayscale(1); opacity:.4;}
  .badge.earned .b-ico{filter:none; opacity:1;}
  .badge.earned{border-color:rgba(255,149,0,.5); background:var(--warn-soft);}

  /* ---------- 提示 / 彩带 ---------- */
  #toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
    background:rgba(28,28,30,0.85); color:#fff; border:1px solid rgba(255,255,255,0.2); padding:12px 20px; border-radius:14px; font-size:14px;
    opacity:0; transition:.3s; z-index:99; max-width:90vw; box-shadow:0 10px 30px rgba(0,0,0,.25);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .confetti{position:fixed; top:-20px; z-index:100; pointer-events:none; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg); opacity:.2;}}

  /* ---------- 响应式 ---------- */
  @media(max-width:820px){
    .layout{flex-direction:column; padding:12px;}
    aside{width:100%;}
    #sidebar{position:static; flex-direction:row; overflow-x:auto; gap:4px; padding:10px;}
    .nav-btn{white-space:nowrap;}
    .nav-group{display:none;}
    .brand small{display:none;}
  }
  .table-wrap{overflow-x:auto;}
  table{border-collapse:collapse; width:100%; font-size:14px; margin:10px 0;}
  th,td{border:1px solid var(--line); padding:8px 12px; text-align:left;}
  th{background:var(--accent-soft);}
  td code{background:var(--accent-soft); color:var(--accent); padding:1px 6px; border-radius:6px;}
.demo{margin:14px 0;padding:16px;background:#fbfcff;border:1px solid rgba(0,0,0,0.06);border-radius:16px;}
.demo-title{font-weight:700;font-size:14px;margin-bottom:10px;}
.demo-svg{overflow:hidden;}
.demo-controls{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.demo-ctl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);}
.demo-ctl input[type=range]{width:100%;accent-color:#5e5ce6;cursor:pointer;}
.demo-note{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.5;}
.video-block{margin:14px 0;padding:14px 16px;background:#f0f6ff;border:1px solid rgba(10,132,255,.16);border-radius:14px;}
.video-title{font-weight:700;font-size:13px;margin-bottom:10px;color:#0a84ff;}
.video-link{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:6px 0;background:#fff;border:1px solid rgba(0,0,0,0.06);border-radius:10px;text-decoration:none;color:var(--text);transition:.15s;}
.video-link:hover{border-color:#0a84ff;box-shadow:0 4px 12px rgba(10,132,255,.12);}
.video-ico{font-size:16px;}
.video-txt{flex:1;font-size:13px;}
.video-arrow{color:#9aa0aa;}
</style>
</head>
<body>
  <header>
    <div class="brand">☕ AP CSA 学习平台<small>Java 从零到 5 分</small></div>
    <div class="stats">
      <a href="index.html" class="stat" style="text-decoration:none;font-weight:700">🏠 选科目</a>
      <span class="stat" id="stat-level">Lv.1 新手</span>
      <span class="stat" id="stat-xp">0 XP</span>
      <span class="stat" id="stat-streak">🔥 0 天</span>
      <span class="stat" id="stat-pct">0% 掌握</span>
    </div>
  </header>

  <div class="layout">
    <aside><nav id="sidebar"></nav></aside>
    <main id="main"></main>
  </div>

  <div id="toast"></div>

<script>const UNITS = [];
UNITS.push({
  id: 0, title: "Getting Started", cn: "零基础入门", icon: "🐣",
  objective: "Understand programs, variables, and types from scratch · 从零认识程序、变量与类型",
  lesson: [
    {t:"h", text:"What is a Program? · 什么是程序"},
    {t:"p", text:"A **program** (程序) is a set of instructions for the computer, executed **top to bottom, one line at a time** — like following a recipe."},
    {t:"c", code:`public class Hello {
    public static void main(String[] args) {
        System.out.println("Hello, world!");
    }
}`},
    {t:"p", text:"Don't worry about `public static` for now — just remember the key line: `System.out.println(...)` means **print what's inside the parentheses to the screen**. Text goes in double quotes `\"...\"`."},
    {t:"h", text:"What is a Variable? · 什么是变量"},
    {t:"p", text:"A **variable** (变量) is a **named box** that holds data. The label (name) lets you find it and use what's inside."},
    {t:"c", code:`int age = 12;
// Read as: make a box that only holds integers, name it "age", put 12 in it`},
    {t:"h", text:"What is a Type? · 什么是类型"},
    {t:"p", text:"A **type** (类型) decides **what a box can hold**. Each type has its own rules — the wrong kind causes an error."},
    {t:"c", code:`int      holds integers      e.g. -5, 0, 42
double   holds decimals      e.g. 3.14, -0.5
boolean  holds true/false
char     holds one character e.g. 'A', '7'   (single quotes)
String   holds text          e.g. "hello"   (double quotes)`},
    {t:"warn", text:"Putting the wrong kind in a box is an error: `int x = 3.5` is wrong (an integer box can't hold a decimal), and `int y = \"hi\"` is wrong too."},
    {t:"h", text:"Declare → Assign → Use · 变量的三步"},
    {t:"c", code:`int score;                  // ① declare: a box named score, for integers
score = 95;                 // ② assign: put 95 in it
System.out.println(score);  // ③ use: print it → 95

// Or do it in one step:
int score = 95;`},
    {t:"li", items:["Program = instructions, executed top to bottom","Variable = a named box with a type","int, double, boolean, char, String","`System.out.println(...)` prints to the screen"]},
    {t:"video", title:"Recommended Videos · 推荐视频", links:[
      {site:"YouTube", label:"Crash Course Computer Science（计算机科学入门）", url:"https://www.youtube.com/playlist?list=PL8dPuuaLjXtNlUrzyH5r6jN9ulIgZBpdo"},
      {site:"Bilibili", label:"Ron老师讲APCSA（AP计算机科学A课程）", url:"https://www.bilibili.com/cheese/play/ss160110203"},
    ]},
  ],
  questions: [
    {kind:"mcq", q:"What does `System.out.println(...)` do?", options:["Prints content to the screen","Saves content to a file","Pauses the program","Computes a result"], answer:0, explain:"println means \"print a line\" — it outputs the content to the screen.（println 就是打印一行。）"},
    {kind:"mcq", q:"A variable is most like?", options:["A labeled box","A computed result","A folder","A piece of text"], answer:0, explain:"A variable is a named box that holds data.（变量=有名字的盒子。）"},
    {kind:"mcq", q:"What can an `int` variable hold?", options:["An integer","A decimal","Text","True or false"], answer:0, explain:"int holds integers like 12, -5, 0.（int 只能装整数。）"},
    {kind:"mcq", q:"What can a `boolean` variable hold?", options:["true or false","Any integer","A decimal","A piece of text"], answer:0, explain:"boolean only holds true or false.（boolean 只装 true/false。）"},
    {kind:"mcq", q:"A `char` value uses which quotes?", options:["Single quotes ''","Double quotes \"\"","No quotes","Square brackets []"], answer:0, explain:"char holds one character in single quotes, like 'A'.（char 用单引号。）"},
    {kind:"mcq", q:"A `String` value uses which quotes?", options:["Double quotes \"\"","Single quotes ''","No quotes","Parentheses ()"], answer:0, explain:"String holds text in double quotes, like \"hello\".（String 用双引号。）"},
    {kind:"trace", q:"What does `System.out.println(\"Hi\");` display?", options:["Hi","\"Hi\"","Hi with quotes","Nothing"], answer:0, explain:"The double quotes just tell the computer \"this is text\"; only Hi is printed.（只打印 Hi，不带引号。）"},
    {kind:"mcq", q:"What does `int x = 5;` do?", options:["Creates an integer box x and puts 5 in it","Prints 5","Compares x and 5","Deletes x"], answer:0, explain:"int declares the type, x is the name, = 5 puts 5 in the box.（声明 int 变量 x 并赋值 5。）"},
  ],
});

UNITS.push({
  id: 1, title: "Primitive Types", cn: "基础类型", icon: "🔢",
  objective: "Learn variables, the four primitive types, arithmetic, and casting · 掌握变量、四种原始类型、运算与类型转换",
  lesson: [
    {t:"h", text:"Review: Variables as Labeled Boxes · 回忆：变量是盒子"},
    {t:"p", text:"From the last lesson, a variable is a **named box with a type** (有名字、有类型的盒子). This lesson focuses on **arithmetic** and **casting** (类型转换)."},
    {t:"h", text:"Review: 5 Common Types · 复习 5 种类型"},
    {t:"c", code:`int      integers      e.g. int age = 12;
double   decimals      e.g. double pi = 3.14;
boolean  true/false    e.g. boolean ok = true;
char     one character e.g. char grade = 'A';   // single quotes
String   text          e.g. String name = "Alex"; // double quotes`},
    {t:"tip", text:"Mnemonic: **int integers, double decimals, boolean true/false, char one char, String text**."},
    {t:"h", text:"Arithmetic Operations · 算术运算"},
    {t:"c", code:`+ add    - subtract    * multiply    / divide    % remainder
int a = 7 + 3;   // 10
int b = 7 - 3;   // 4
int c = 7 * 3;   // 21
int d = 7 / 2;   // 3  ← note!`},
    {t:"warn", text:"**Integer division truncates** (整数相除会截断): `7 / 2` is 3, not 3.5 — like \"7 apples for 2 people, each gets 3, the leftover 1 is dropped\". To get 3.5, write `7.0 / 2` or `(double) 7 / 2`."},
    {t:"h", text:"Modulo % · 取余"},
    {t:"p", text:"`%` gives the **remainder** (余数). `13 % 5` is \"13 divided by 5 leaves a remainder of\" → 3. Check parity with `n % 2 == 0` (even) or `n % 2 == 1` (odd)."},
    {t:"h", text:"Order of Operations · 运算顺序"},
    {t:"c", code:`Step 1: parentheses ( )
Step 2: *  /  %   (multiply, divide, remainder)
Step 3: +  -   (add, subtract)
Same level: left to right.`},
    {t:"c", code:`int x = 4 + 6 / 2;
// first 6 / 2 = 3
// then 4 + 3 = 7
// so x = 7`},
    {t:"h", text:"Type Casting · 类型转换"},
    {t:"p", text:"To turn a decimal into an integer, use `(int)` to **chop off the decimal part** (not round)."},
    {t:"c", code:`(int) 3.9    → 3     // chops off .9
(int) -2.7   → -2    // also chops, not round
(double) 7   → 7.0   // integer → decimal`},
    {t:"li", items:["Variable = a named, typed box","int, double, boolean, char, String","7 / 2 = 3 (truncates), 7.0 / 2 = 3.5","% is remainder, (int) chops decimals","Order: parentheses → * / % → + -"]},

  prompt: "Implement the static method `removeShort(ArrayList<String> words, int minLen)`: remove all strings whose length is less than minLen, and return the number removed. The relative order of the remaining strings must stay the same.\n\nHint: forward removal shifts indexes and can skip elements — think about how to avoid that.",
  points: [
    "Check length() < minLen",
    "Call remove to delete the element",
    "Handle indexes: iterate backward, or step back after each removal, to avoid skipping",
    "Count and return the number removed",
    "Edge case: nothing to remove returns 0 without error",
  ],
  answerText: "The safest approach is to iterate backward: `for (int i = words.size()-1; i >= 0; i--)`. Removing an element then doesn't affect earlier indexes, so nothing is skipped. Forward removal needs `i--` after each delete.",
  answer: "public static int removeShort(ArrayList<String> words, int minLen) {\n    int removed = 0;\n    for (int i = words.size() - 1; i >= 0; i--) {\n        if (words.get(i).length() < minLen) {\n            words.remove(i);\n            removed++;\n        }\n    }\n    return removed;\n}",

<script>
/* ============================================================
   应用逻辑
   ============================================================ */
const KEY = "apcsa_v1";
const $  = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function inline(s){ return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>"); }
function hl(code){
  const re = /(\/\/[^\n]*)|(&quot;(?:[^&]|&(?!quot;))*?&quot;)|(&#39;[^&]*?&#39;)|\b(public|private|protected|static|final|void|int|double|boolean|char|String|byte|short|long|float|class|interface|extends|implements|new|return|if|else|for|while|do|switch|case|break|continue|this|super|true|false|null|import|package|instanceof)\b|\b(\d+(?:\.\d+)?)\b/g;
  return esc(code).replace(re, (m, cm, st, ch, kw, num) => {
    if (cm) return '<span class="cm">'+cm+'</span>';
    if (st) return '<span class="st">'+st+'</span>';
    if (ch) return '<span class="st">'+ch+'</span>';
    if (kw) return '<span class="kw">'+kw+'</span>';
    if (num) return '<span class="num">'+num+'</span>';
    return m;
  });
}
function renderBlocks(blocks){
  return blocks.map(b => {
    if (b.t === "h") return "<h3>"+inline(b.text)+"</h3>";
    if (b.t === "p") return "<p class='body'>"+inline(b.text)+"</p>";
    if (b.t === "c") return "<div class='block-code'>"+hl(b.code)+"</div>";
    if (b.t === "tip") return "<div class='callout tip'><span class='ico'>💡</span><div>"+inline(b.text)+"</div></div>";
    if (b.t === "warn") return "<div class='callout warn'><span class='ico'>⚠️</span><div>"+inline(b.text)+"</div></div>";
    if (b.t === "err") return "<div class='callout err'><span class='ico'>❌</span><div>"+inline(b.text)+"</div></div>";
    if (b.t === "li") return "<ul class='li'>"+b.items.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>";
    if (b.t === "table") return "<div class='table-wrap'><table>"+b.rows.map((r,i)=> "<tr>"+r.map((c,j)=> (i===0?"<th>":"<td>")+inline(c)+(i===0?"</th>":"</td>")).join("")+"</tr>").join("")+"</table></div>";
    if (b.t === "demo") return renderDemo(b.type);
    if (b.t === "video") return renderVideo(b);
    return "";
  }).join("");
}

/* ---------- 状态 ---------- */
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function defaultState(){ return {xp:0, lastDay:todayStr(), streak:1, badges:[], lessonsRead:{}, q:{}, quizDone:{}, frqDone:{}, examBest:null, examAttempts:0}; }
let state;
try{ state = JSON.parse(localStorage.getItem(KEY)) || defaultState(); }catch(e){ state = defaultState(); }
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function todayStr2(){ return state.lastDay; }
function updateStreak(){
  const t = todayStr();
  if (state.lastDay === t) return;
  const y = new Date(Date.now()-86400000);
  const ystr = y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
  state.streak = (state.lastDay === ystr) ? state.streak+1 : 1;
  state.lastDay = t;
}
function level(){ return Math.min(15, Math.floor(state.xp/150)+1); }
function levelTitle(){ return LEVEL_TITLES[Math.min(LEVEL_TITLES.length-1, level()-1)]; }
function gid(uid, qi){ return uid+":"+qi; }

/* ---------- 积分与徽章 ---------- */
function addXP(n){
  if(n<=0) return;
  const before = level();
  state.xp += n;
  const after = level();
  if(after > before){ toast("🎉 升级！现在是 Lv."+after+" "+levelTitle()); }
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove("show"), 2600); }
function checkBadges(){
  const earned = new Set(state.badges);
  const doneUnits = UNITS.filter(u=>state.quizDone[u.id]).length;
  const perfect = UNITS.some(u=> state.quizDone[u.id] && u.questions.every((q,i)=> state.q[gid(u.id,i)] && state.q[gid(u.id,i)].ft === true));
  const frqCount = Object.keys(state.frqDone || {}).length;
  const realCount = state.realDone || 0;
  const exam = state.examBest;
  const lv = level();

  const conds = [
    ["first_xp", state.xp >= 10],
    ["unit1", doneUnits >= 1],
    ["unit3", doneUnits >= 3],
    ["five", doneUnits >= 5],
    ["unit8", doneUnits >= 8],
    ["all", doneUnits >= UNITS.length && UNITS.length > 0],
    ["perfect", perfect],
    ["exam60", exam !== null && exam >= 60],
    ["exam80", exam !== null && exam >= 80],
    ["exam90", exam !== null && exam >= 90],
    ["exam100", exam !== null && exam >= 100],
    ["streak3", state.streak >= 3],
    ["streak7", state.streak >= 7],
    ["streak14", state.streak >= 14],
    ["streak30", state.streak >= 30],
    ["xp100", state.xp >= 100],
    ["xp500", state.xp >= 500],
    ["xp1000", state.xp >= 1000],
    ["xp3000", state.xp >= 3000],
    ["first_frq", frqCount >= 1],
    ["first_real", realCount >= 1],
    ["level5", lv >= 5],
    ["level10", lv >= 10],
  ];
  const newOnes = [];
  conds.forEach(([id, ok])=>{
    if(ok && !earned.has(id)){ state.badges.push(id); newOnes.push(id); }
  });
  if(newOnes.length){
    save();
    const names = newOnes.map(id => BADGES.find(b=>b.id===id).name).join("、");
    toast("🏅 获得徽章：" + names);
  }
}

/* ---------- 题目统计 ---------- */
function qStatus(uid, qi){ return state.q[gid(uid,qi)] || null; }
function unitStats(unit){
  let correct=0, attempted=0, firstTryRight=0;
  unit.questions.forEach((q,i)=>{
    const s = qStatus(unit.id, i);
    if(s){ attempted++; if(s.correct) correct++; if(s.ft) firstTryRight++; }
  });
  return {correct, attempted, total:unit.questions.length, firstTryRight};
}
function overallStats(){
  let correct=0, total=0;
  UNITS.forEach(u=>{ const s=unitStats(u); correct+=s.correct; total+=s.total; });
  return total ? Math.round(correct/total*100) : 0;
}
function flattenAll(){
  const arr=[];
  UNITS.forEach(u=> u.questions.forEach((q,i)=> arr.push({q, uid:u.id, qi:i, unit:u})));
  return arr;
}

let view = {name:"home"};

function nav(){

/* ================= 练习 ================= */
function startQuiz(uid){
  const u = UNITS.find(x=>x.id===uid);
  quizSession = {uid, idx:0, order:u.questions.map((_,i)=>i)};
}
function quizHTML(u, idx){
  if(!u) return "";
  if(!quizSession){ startQuiz(u.id); }
  const s = quizSession;
  const qi = s.order[s.idx];
  const q = u.questions[qi];
  const st = qStatus(u.id, qi);
  const answered = !!st;
  const total = s.order.length;
  let opts = "";
  if(q.options){
    opts = '<div class="options">'+q.options.map((o,i)=>{
      let cls="opt"; let ltr="ABCD"[i];
      if(answered){
        cls += " disabled";
        if(i===q.answer) cls += " correct";
        else if(i===st.picked) cls += " wrong";
      }
      return '<button class="'+cls+'" data-opt="'+i+'"><span class="ltr">'+ltr+'.</span><span>'+inline(o)+'</span></button>';
    }).join("")+'</div>';
  }
  const explain = answered ? '<div class="explain '+(st.correct?"good":"bad")+'"><b>'+(st.correct?"✅ 回答正确！":"❌ 回答错误")+'</b>'+inline(q.explain)+'</div>' : "";
  const nextBtn = answered ? '<button class="btn" data-next>'+(s.idx < total-1 ? "下一题 →" : "查看结果 🎉")+'</button>' : "";
  return ''+
  '<div class="card"><div class="spread" style="margin-bottom:10px">'+
  '<span class="q-meta">第 '+(s.idx+1)+' / '+total+' 题 · '+(q.kind==="trace"?"🔍 代码追踪":"🧩 概念题")+'</span>'+
  '<span class="muted" style="font-size:13px">已掌握 '+unitStats(u).correct+'/'+total+'</span></div>'+
  '<div class="q-text">'+inline(q.q)+'</div>'+
  (q.code ? '<div class="block-code">'+hl(q.code)+'</div>' : "")+
  opts + explain +
  '<div style="margin-top:16px" class="row">'+nextBtn+
  '<button class="btn ghost sm" data-tab="lesson">← 返回知识点</button></div></div>';
}
function answerQuestion(opt){
  const u = UNITS.find(x=>x.id===quizSession.uid);
  const qi = quizSession.order[quizSession.idx];
  const q = u.questions[qi];
  const key = gid(u.id, qi);
  const prev = state.q[key];
  const correct = opt === q.answer;
  const firstTime = !prev;
  const wasWrong = prev && !prev.correct;

  if(firstTime){
    if(correct){ addXP(10); state.q[key]={correct:true, ft:true, picked:opt}; toast("+10 XP 🎉"); }
    else{ state.q[key]={correct:false, ft:false, picked:opt}; toast("再想想，看看解析吧 💪"); }
  } else if(wasWrong && correct){
    addXP(4); state.q[key]={correct:true, ft:prev.ft, picked:opt}; toast("+4 XP 改正成功 ✅");
  } else if(wasWrong && !correct){
    state.q[key]={correct:false, ft:false, picked:opt};
  } else {
    state.q[key].picked = opt; // 已正确，随意重看
  }
  save(); render();
}
function nextQuestion(){
  const u = UNITS.find(x=>x.id===quizSession.uid);
  const total = quizSession.order.length;
  if(quizSession.idx < total-1){ quizSession.idx++; render(); return; }
  const st = unitStats(u);
  const allCorrect = st.correct === total;
  const perfect = st.firstTryRight === total;
  if(!state.quizDone[u.id]){
    state.quizDone[u.id] = true;
    addXP(20);
    if(allCorrect){ toast("🎊 完成本单元！+20 XP"); if(perfect) confetti(); }
    else { toast("📦 完成本单元（可随时回来补错题）+20 XP"); }
    save(); checkBadges();
  }
  quizSession = null;
  view = {name:"unitresult", uid:u.id};
  nav(); render();
}

function startExam(){
  const pool = [...flattenAll(), ...flattenReal()];
  const shuffled = [...pool].sort(()=>Math.random()-0.5).slice(0, Math.min(30, pool.length));
  examSession = {items: shuffled, idx:0, picked: [], start: Date.now()};
  state.examAttempts++;
  save(); render();
}
function examClock(){
  const sec = Math.floor((Date.now()-examSession.start)/1000);
  return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
}
function examPick(opt){ examSession.picked[examSession.idx] = opt; render(); }
function examNext(){ examSession.idx++; render(); }
function finishExam(){
  const s = examSession;
  const score = s.items.reduce((acc,it,i)=> acc + (s.picked[i]===it.q.answer?1:0), 0);
  const pct = Math.round(score/s.items.length*100);
  if(state.examBest===null || pct>state.examBest){ state.examBest=pct; }
  view.finished = true; view.score=score; view.total=s.items.length; view.pct=pct;
  addXP(score * 2);
  if(pct >= 80) addXP(10);
  save(); checkBadges(); render();
  if(pct>=80) confetti();
}

  '<button class="btn" data-startreal>▶️ 开始演练</button></div>';
}
function realHTML(){
  if(!realSession) return realIntroHTML();
  if(realSession.finished) return realResultHTML();
  const s = realSession;
  const qi = s.order[s.idx];
  const q = REALEXAM[qi];
  const total = s.order.length;
  const ans = s.answers[s.idx];
  const answered = !!ans;
  let opts = '';
  if(q.options){
    opts = '<div class="options">'+q.options.map((o,i)=>{
      let cls="opt";
      if(answered){ cls += " disabled"; if(i===q.answer) cls += " correct"; else if(i===ans.picked) cls += " wrong"; }
      return '<button class="'+cls+'" data-realopt="'+i+'"><span class="ltr">'+"ABCD"[i]+'.</span><span>'+inline(o)+'</span></button>';
    }).join("")+'</div>';
  }
  const explain = answered ? '<div class="explain '+(ans.correct?"good":"bad")+'"><b>'+(ans.correct?"✅ 正确":"❌ 错误")+'</b>'+inline(q.explain)+'</div>' : "";
  const nextBtn = answered ? '<button class="btn" data-realnext>'+(s.idx<total-1?"下一题 →":"查看成绩 🎉")+'</button>' : "";
  return '<div class="card"><div class="spread" style="margin-bottom:10px">'+
  '<span class="q-meta">真题演练 · 第 '+(s.idx+1)+' / '+total+' 题 · '+inline(q.topic)+'</span>'+
  '<button class="btn ghost sm" data-realexit>✕ 退出</button></div>'+
  '<div class="q-text">'+inline(q.q)+'</div>'+
  (q.code?'<div class="block-code">'+hl(q.code)+'</div>':"")+
  opts + explain +
  '<div style="margin-top:16px" class="row">'+nextBtn+'</div></div>';
}
function realAnswer(opt){
  const s = realSession;
  const qi = s.order[s.idx];
  const q = REALEXAM[qi];
  const correct = opt === q.answer;
  s.answers[s.idx] = {picked:opt, correct};
  if(correct){ addXP(8); toast("+8 XP ✅"); }
  else { toast("看看解析 💪"); }
  save(); render();
}
function realNext(){
  const s = realSession;
  if(s.idx < s.order.length-1){ s.idx++; render(); return; }
  s.finished = true;
  if(!state.realDone) state.realDone = 0;
  state.realDone++;
  save(); checkBadges();
  render();
}
function realResultHTML(){
  const s = realSession;
  const total = s.order.length;
  const correct = s.answers.filter(a=>a && a.correct).length;
  const pct = Math.round(correct/total*100);

  s.order.forEach((qi,i)=>{ if(!s.answers[i] || !s.answers[i].correct) wrong.push({q:REALEXAM[qi], i}); });
  return '<div class="card"><h1>'+(pct>=80?"🏆 成绩不错！":"📊 演练完成")+'</h1>'+

  '<h2>错题回顾</h2>'+

/* ================= 事件绑定 ================= */
document.addEventListener("click", e=>{
  const t = e.target;
  const goBtn = t.closest("[data-go]");
  if(goBtn){
    if(goBtn.dataset.go==="unit"){ go("unit", {uid:+goBtn.dataset.uid, tab:"lesson"}); return; }
    if(goBtn.dataset.go==="frq" && goBtn.dataset.fid){ go("frq", {id:+goBtn.dataset.fid}); return; }
    if(goBtn.dataset.go==="random"){ view={name:"random"}; nav(); $("#main").innerHTML = randomHTML(); return; }
    go(goBtn.dataset.go);
    return;
  }
  const tabBtn = t.closest("[data-tab]");
  if(tabBtn){ view.tab = tabBtn.dataset.tab; if(view.name==="unit") render(); return; }
  const mark = t.closest("[data-markread]");
  if(mark){
    const uid = +mark.dataset.markread;
    if(!state.lessonsRead[uid]){ state.lessonsRead[uid]=true; addXP(5); toast("+5 XP 完成学习 ✅"); save(); }
    else { state.lessonsRead[uid]=false; save(); }
    render(); return;
  }
  const opt = t.closest("[data-opt]");
  if(opt){ answerQuestion(+opt.dataset.opt); return; }
  const nx = t.closest("[data-next]");
  if(nx){ nextQuestion(); return; }
  const retry = t.closest("[data-retry]");
  if(retry){ startQuiz(+retry.dataset.retry); view = {name:"unit", uid:+retry.dataset.retry, tab:"quiz"}; nav(); render(); return; }
  const reveal = t.closest("[data-reveal]");
  if(reveal){ revealFRQ(reveal.dataset.reveal); return; }
  const frqdone = t.closest("[data-frqdone]");
  if(frqdone){ const fid=+frqdone.dataset.frqdone; if(!state.frqDone[fid]){ state.frqDone[fid]=true; addXP(20); toast("🎉 完成一道 FRQ！+20 XP"); } save(); checkBadges(); render(); return; }
  const se = t.closest("[data-startexam]");
  if(se){ startExam(); return; }
  const eo = t.closest("[data-examopt]");
  if(eo){ examPick(+eo.dataset.examopt); return; }
  const en = t.closest("[data-examnext]");
  if(en){ examNext(); return; }
  const ef = t.closest("[data-examfinish]");
  if(ef){ finishExam(); return; }
  const ro = t.closest("[data-randopt]");
  if(ro){ answerRandom(+ro.dataset.randopt); return; }
  const ex = t.closest("[data-export]");
  if(ex){ exportData(); return; }
  const im = t.closest("[data-import]");
  if(im){ const inp = $("#importFile"); if(inp) inp.click(); return; }
  const sr = t.closest("[data-startreal]");
  if(sr){ startReal(); return; }
  const rp = t.closest("[data-realopt]");
  if(rp){ realAnswer(+rp.dataset.realopt); return; }
  const rn = t.closest("[data-realnext]");
  if(rn){ realNext(); return; }
  const rx = t.closest("[data-realexit]");
  if(rx){ go("home"); return; }
});

/* 随机练习答题（简化版） */
let randomCurrent = null;
function answerRandom(opt){
  if(!randomCurrent) return;
  const pick = randomCurrent;
  const key = gid(pick.uid, pick.qi);
  const prev = state.q[key];
  const correct = opt === pick.q.answer;
  if(!prev){
    if(correct){ addXP(10); state.q[key]={correct:true,ft:true,picked:opt}; toast("+10 XP 🎉"); }
    else{ state.q[key]={correct:false,ft:false,picked:opt}; }
  } else if(!prev.correct && correct){
    addXP(4); state.q[key]={correct:true,ft:prev.ft,picked:opt}; toast("+4 XP ✅");
  } else if(!prev.correct && !correct){
    state.q[key]={correct:false,ft:false,picked:opt};
  } else { state.q[key].picked=opt; }
  save(); nav(); $("#main").innerHTML = randomHTML();
}

/* ================= 进度备份 / 恢复 ================= */
function exportData(){
  try{
    const data = JSON.stringify(state, null, 2);
    const blob = new Blob([data], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "apcsa-progress-" + todayStr() + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast("✅ 备份文件已下载");
  }catch(e){ toast("❌ 导出失败：" + e.message); }
}
function importData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const obj = JSON.parse(ev.target.result);
      if(!obj || typeof obj !== "object" || (!("xp" in obj) && !("q" in obj))){ toast("❌ 这不是有效的备份文件"); return; }
      state = obj;
      if(!state.q) state.q = {};
      if(!state.lessonsRead) state.lessonsRead = {};
      if(!state.quizDone) state.quizDone = {};
      if(!state.frqDone) state.frqDone = {};
      if(!state.badges) state.badges = [];
      if(state.examBest === undefined) state.examBest = null;
      if(!state.examAttempts) state.examAttempts = 0;
      save();
      go("home");
      toast("✅ 进度已恢复");
    }catch(e){ toast("❌ 备份文件解析失败"); }
  };
  reader.readAsText(file);
}

function sineSVG(p){
  const W=420, H=300, L=44, R=16, T=22, B=42;
  const A=p.amp, freq=p.freq, xmin=0, xmax=2*Math.PI, ymax=A*1.35, ymin=-A*1.35;
  const X=x=>L+(x-xmin)/(xmax-xmin)*(W-L-R);
  const Y=y=>H-B-(y-ymin)/(ymax-ymin)*(H-T-B);
  let s='';
  for(let i=0;i<=6;i++){ const x=xmin+(xmax-xmin)*i/6; s+='<line x1="'+X(x).toFixed(1)+'" y1="'+Y(ymin)+'" x2="'+X(x).toFixed(1)+'" y2="'+Y(ymax)+'" stroke="#eef0f6" stroke-width="1"/>'; }
  s+='<line x1="'+X(xmin)+'" y1="'+Y(0)+'" x2="'+X(xmax)+'" y2="'+Y(0)+'" stroke="#b6bcc8" stroke-width="1.5"/>';
  s+='<line x1="'+X(xmin)+'" y1="'+Y(ymin)+'" x2="'+X(xmin)+'" y2="'+Y(ymax)+'" stroke="#b6bcc8" stroke-width="1.5"/>';
  let d='';
  for(let i=0;i<=240;i++){ const x=xmin+(xmax-xmin)*i/240, y=A*Math.sin(freq*x); d+=(i?' L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1); }
  s+='<path d="'+d+'" fill="none" stroke="#5e5ce6" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
  s+='<text x="'+((W-L-R)/2+L)+'" y="'+(H-12)+'" text-anchor="middle" fill="#5e5ce6" font-size="13" font-weight="600">y = '+A+'·sin('+freq+'x)</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;background:#fbfcff;border-radius:12px">'+s+'</svg>';
}

function expSVG(p){
  const W=420, H=300, L=48, R=16, T=22, B=42;
  const b=p.base, xmin=-2, xmax=3.5;
  let ymax=Math.pow(b, xmax), ymin=Math.pow(b, xmin);
  if(ymax<ymin){ const t=ymax; ymax=ymin; ymin=t; }
  ymax=Math.min(16, Math.max(ymax, 1.2)); ymin=0;
  const X=x=>L+(x-xmin)/(xmax-xmin)*(W-L-R);
  const Y=y=>H-B-(y-ymin)/(ymax-ymin)*(H-T-B);
  let s='';
  for(let i=0;i<=5;i++){ const y=ymax*i/5; s+='<line x1="'+X(xmin)+'" y1="'+Y(y)+'" x2="'+X(xmax)+'" y2="'+Y(y)+'" stroke="#eef0f6" stroke-width="1"/>'; }
  s+='<line x1="'+X(xmin)+'" y1="'+Y(0)+'" x2="'+X(xmax)+'" y2="'+Y(0)+'" stroke="#b6bcc8" stroke-width="1.5"/>';
  s+='<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(0)+'" y2="'+Y(ymax)+'" stroke="#b6bcc8" stroke-width="1.5"/>';
  let d='';
  for(let i=0;i<=240;i++){ const x=xmin+(xmax-xmin)*i/240, y=Math.pow(b,x); d+=(i?' L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1); }
  s+='<path d="'+d+'" fill="none" stroke="#0a84ff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
  s+='<line x1="'+X(xmin)+'" y1="'+Y(1)+'" x2="'+X(xmax)+'" y2="'+Y(1)+'" stroke="#34c759" stroke-width="1.2" stroke-dasharray="5,4"/>';
  s+='<circle cx="'+X(0)+'" cy="'+Y(1)+'" r="3.5" fill="#34c759"/>';
  s+='<text x="'+(W/2)+'" y="'+(H-12)+'" text-anchor="middle" fill="#0a84ff" font-size="13" font-weight="600">y = '+b.toFixed(1)+'ˣ</text>';
  s+='<text x="'+X(0)+'" y="'+Y(1)+'" fill="#34c759" font-size="11" dx="6" dy="-6">(0, 1)</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;background:#fbfcff;border-radius:12px">'+s+'</svg>';
}

function ppcSVG(p){
  const W=420, H=300, L=48, R=16, T=22, B=42;
  const g=p.growth, max=10*g;
  const X=x=>L+(x/(max*1.2))*(W-L-R);
  const Y=y=>H-B-(y/(max*1.2))*(H-T-B);
  let s='';
  s+='<line x1="'+L+'" y1="'+Y(0)+'" x2="'+X(max*1.15)+'" y2="'+Y(0)+'" stroke="#b6bcc8" stroke-width="1.5"/>';
  s+='<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(0)+'" y2="'+Y(max*1.15)+'" stroke="#b6bcc8" stroke-width="1.5"/>';
  let d='';
  for(let i=0;i<=120;i++){ const x=max*i/120; const y=max*Math.sqrt(1-Math.pow(x/max,2)); d+=(i?' L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1); }
  s+='<path d="'+d+'" fill="none" stroke="#f59e0b" stroke-width="2.8" stroke-linejoin="round"/>';
  let ex=0.5*max, ey=max*Math.sqrt(1-0.25);
  s+='<circle cx="'+X(ex)+'" cy="'+Y(ey)+'" r="4" fill="#34c759"/>';
  s+='<text x="'+X(ex)+'" y="'+Y(ey)+'" fill="#1a9d5c" font-size="11" dx="8" dy="-6">Efficient</text>';
  let ix=0.4*max, iy=0.4*max;
  s+='<circle cx="'+X(ix)+'" cy="'+Y(iy)+'" r="4" fill="#ff9500"/>';
  s+='<text x="'+X(ix)+'" y="'+Y(iy)+'" fill="#c76e00" font-size="11" dx="8" dy="16">Inefficient</text>';
  let ux=0.85*max, uy=0.85*max;
  s+='<circle cx="'+X(ux)+'" cy="'+Y(uy)+'" r="4" fill="#ff3b30"/>';
  s+='<text x="'+X(ux)+'" y="'+Y(uy)+'" fill="#c40000" font-size="11" dx="8" dy="-6">Unattainable</text>';
  s+='<text x="'+X(max)+'" y="'+Y(0)+'" fill="#9aa0aa" font-size="11" dy="16">Good A</text>';
  s+='<text x="'+X(0)+'" y="'+Y(max)+'" fill="#9aa0aa" font-size="11" dx="-34" dy="-4">Good B</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;background:#fbfcff;border-radius:12px">'+s+'</svg>';
}

function supplySVG(p){
  const W=420, H=300, L=52, R=16, T=22, B=42;
  const D0=p.demand, S0=p.supply;
  const qmax=14, pmax=12;
  const X=q=>L+(q/qmax)*(W-L-R);
  const Y=price=>H-B-(price/pmax)*(H-T-B);
  const Qe=(D0-S0)/1.4, Pe=D0-0.8*Qe;
  let s='';
  for(let i=1;i<=6;i++){ s+='<line x1="'+X(0)+'" y1="'+Y(pmax*i/6)+'" x2="'+X(qmax)+'" y2="'+Y(pmax*i/6)+'" stroke="#eef0f6" stroke-width="1"/>'; }
  s+='<line x1="'+L+'" y1="'+Y(0)+'" x2="'+X(qmax)+'" y2="'+Y(0)+'" stroke="#b6bcc8" stroke-width="1.5"/>';
  s+='<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(0)+'" y2="'+Y(pmax)+'" stroke="#b6bcc8" stroke-width="1.5"/>';
  s+='<line x1="'+X(0)+'" y1="'+Y(D0)+'" x2="'+X(D0/0.8)+'" y2="'+Y(0)+'" stroke="#ff3b30" stroke-width="2.6"/>';
  const qsupply=(pmax-S0)/0.6;
  s+='<line x1="'+X(0)+'" y1="'+Y(S0)+'" x2="'+X(qsupply)+'" y2="'+Y(pmax)+'" stroke="#0a84ff" stroke-width="2.6"/>';
  s+='<circle cx="'+X(Qe)+'" cy="'+Y(Pe)+'" r="4.5" fill="#5e5ce6"/>';
  s+='<text x="'+X(Qe)+'" y="'+Y(Pe)+'" fill="#5e5ce6" font-size="11" dx="8" dy="-6">Equilibrium P='+Pe.toFixed(1)+' Q='+Qe.toFixed(1)+'</text>';
  s+='<text x="'+X(D0/0.8)+'" y="'+Y(0)+'" fill="#ff3b30" font-size="12" font-weight="600" dy="16">Demand D</text>';
  s+='<text x="'+X(qsupply)+'" y="'+Y(pmax)+'" fill="#0a84ff" font-size="12" font-weight="600" dy="-6">Supply S</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;background:#fbfcff;border-radius:12px">'+s+'</svg>';
}

function loopSVG(p){
  const arr=[3,1,4,1,5], i=Math.round(p.i), N=arr.length;
  const sum=arr.slice(0,i).reduce((a,b)=>a+b,0);
  const W=420, H=190, L=40, R=20, T=36, B=30;
  const bw=(W-L-R)/N;
  let s='';
  for(let k=0;k<N;k++){
    const x=L+k*bw;
    const active=(k===i && i<N);
    s+='<rect x="'+x+'" y="'+T+'" width="'+(bw-8)+'" height="56" rx="8" fill="'+(active?'#5e5ce6':'#fff')+'" stroke="'+(active?'#5e5ce6':'#c6ccd8')+'" stroke-width="1.5"/>';
    s+='<text x="'+(x+(bw-8)/2)+'" y="'+(T+32)+'" text-anchor="middle" fill="'+(active?'#fff':'#333')+'" font-size="18" font-weight="700">'+arr[k]+'</text>';
    s+='<text x="'+(x+(bw-8)/2)+'" y="'+(T+72)+'" text-anchor="middle" fill="#9aa0aa" font-size="11">['+k+']</text>';
  }
  const inLoop=i<N;
  s+='<text x="'+L+'" y="'+(T+96)+'" fill="'+(inLoop?'#1a9d5c':'#c40000')+'" font-size="13" font-weight="600">i = '+i+'　condition i<'+N+' → '+(inLoop?'true ✅ continue':'false ❌ exit loop')+'</text>';
  s+='<text x="'+L+'" y="'+(T+120)+'" fill="#333" font-size="13">Sum = '+sum+'（first '+i+' elements added）</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;background:#fbfcff;border-radius:12px">'+s+'</svg>';
}

function demoDraw(type, p){
  if(type==="sine") return sineSVG(p);
  if(type==="exp") return expSVG(p);
  if(type==="ppc") return ppcSVG(p);
  if(type==="supply") return supplySVG(p);
  if(type==="loop") return loopSVG(p);
  return "";
}
function renderDemo(type){
  const def = DEMOS[type];
  if(!def) return "";
  const p = {};
  def.controls.forEach(c => p[c.id] = c.value);
  const svg = demoDraw(type, p);
  const controls = def.controls.map(c =>
    '<label class="demo-ctl"><span>'+c.label+'：<b id="dv-'+type+'-'+c.id+'">'+c.value+'</b></span>'+
    '<input type="range" data-demoslider="'+type+'" data-param="'+c.id+'" min="'+c.min+'" max="'+c.max+'" step="'+c.step+'" value="'+c.value+'"></label>'
  ).join("");
  return '<div class="demo"><div class="demo-title">'+def.title+'</div>'+
    '<div class="demo-svg" id="demo-svg-'+type+'">'+svg+'</div>'+
    '<div class="demo-controls">'+controls+'</div>'+
    '<div class="demo-note">'+def.note+'</div></div>';
}
function demoRefresh(type){
  const def = DEMOS[type];
  if(!def) return;
  const p = {};
  def.controls.forEach(c => {
    const inp = document.querySelector('[data-demoslider="'+type+'"][data-param="'+c.id+'"]');
    p[c.id] = inp ? parseFloat(inp.value) : c.value;
    const lab = document.getElementById('dv-'+type+'-'+c.id);
    if(lab) lab.textContent = p[c.id];
  });
  const box = document.getElementById('demo-svg-'+type);
  if(box) box.innerHTML = demoDraw(type, p);
}
document.addEventListener("input", e=>{
  const s = e.target && e.target.closest ? e.target.closest("[data-demoslider]") : null;
  if(s){ demoRefresh(s.dataset.demoslider); }
});

function renderVideo(b){
  const links = (b.links||[]).map(l =>
    '<a class="video-link" href="'+l.url+'" target="_blank" rel="noopener">'+
    '<span class="video-ico">'+(l.site==="YouTube"?"▶️":"📺")+'</span>'+
    '<span class="video-txt"><b>'+l.site+'</b> · '+l.label+'</span><span class="video-arrow">↗</span></a>'
  ).join("");
  return '<div class="video-block"><div class="video-title">🎬 '+(b.title||"Recommended Videos · 推荐视频")+'</div>'+links+'</div>';
}


/* ================= 启动 ================= */
function init(){
  updateStreak();
  // 兼容旧状态字段
  if(!state.q) state.q={};
  if(!state.lessonsRead) state.lessonsRead={};
  if(!state.quizDone) state.quizDone={};
  if(!state.frqDone) state.frqDone={};
  if(state.badges===undefined) state.badges=[];
  save();
  nav(); render(); checkBadges();
}
init();
</script>
